<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Six-Pack Stack Application</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Apply for the Six-Pack Stack. 10 quick questions, about 2 minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Same look as the app: white, navy text, red buttons, Inter, one question per screen. */
:root{--ink:#1b2440;--ink2:#4a5470;--red:#d93a31;--redD:#c22f28;--tint:#fdeceb;--card:#f5f6f9;--line:#e3e6ee;--green:#12804f;--greenT:#e7f6ee}
*{box-sizing:border-box}
html,body{background:#ffffff;color:var(--ink)}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 56px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px;font-weight:900;letter-spacing:-.2px;color:var(--ink);padding-bottom:16px;border-bottom:1px solid #eceef3}
.brand a{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand span:last-child{font-size:13px;font-weight:700;color:var(--ink2)}
.dot{display:inline-block;width:30px;height:30px;border-radius:8px;background:url(/logo-b.png) center/cover no-repeat}
main{flex:1}
h1,h2{text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(34px,8vw,48px);font-weight:900;line-height:1.06;letter-spacing:-1.2px}
h1 em{font-style:normal;color:var(--red)}
h2{font-size:clamp(26px,6.4vw,31px);font-weight:800;line-height:1.2;letter-spacing:-.5px}
p{margin:0}
.soft{color:var(--ink2)}
.small{font-size:15px}
.stack{display:flex;flex-direction:column;gap:20px}
.screen{margin-top:28px}
.btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:18px;background:var(--red);color:#fff;height:56px;padding:0 26px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;transition:background .15s,transform .15s;box-shadow:0 12px 24px -12px rgba(217,58,49,.6)}
.btn:hover{background:var(--redD);color:#fff}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;border:1.5px solid #d9dde7;width:56px;flex:none;padding:0;color:var(--ink);box-shadow:none;font-size:20px}
.btn.navy{background:var(--ink);box-shadow:none}
.btn:focus-visible,.opt:focus-visible,.chk:focus-within,input:focus-visible,textarea:focus-visible,.link:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.link{background:none;border:0;color:var(--ink2);font:inherit;font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.micro{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;font-weight:600;color:var(--ink2)}
.micro span::before{content:"✓ ";color:var(--green);font-weight:900}
.me{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.me img{width:64px;height:64px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--red)}
.next{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:n}
.next li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;counter-increment:n}
.next li::before{content:counter(n);width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}
.progress{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;background:#e8eaf0;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#e2433b;border-radius:3px;transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2)}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:14px;min-height:56px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#c3c8d4}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:600;user-select:none;color:var(--ink)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #c3c8d4;display:grid;place-items:center;font-size:12px;line-height:1;background:#fff}
.chk:has(input:checked){border-color:var(--red);background:var(--red);color:#fff}
.chk:has(input:checked) .box{background:#fff;border-color:#fff;color:var(--red)}
.chk:has(input:checked) .box::after{content:"✓";font-weight:900}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:15px}
.field input,.field textarea{width:100%;font:inherit;font-size:17px;font-weight:600;min-height:56px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:border-color .15s,background .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink);background:#fff}
.field input::placeholder,.field textarea::placeholder{color:#8f97b1;font-weight:500}
.field textarea{min-height:130px;resize:vertical}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:14px;color:var(--ink2)}
.err{color:var(--red);font-size:15px;font-weight:700;min-height:1.2em}
.navrow{display:flex;gap:10px;align-items:center}
.done{display:flex;flex-direction:column;gap:20px;margin-top:48px;text-align:center;align-items:center}
.check{width:76px;height:76px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;box-shadow:0 0 0 8px var(--greenT)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;width:100%}
@media (max-width:420px){.row3{grid-template-columns:1fr}}
@media (min-width:900px){.wrap{padding-block:28px 72px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 20px;margin:48px auto 0;padding-bottom:16px;font-size:13px;font-weight:600}
.legal a{color:var(--ink2);text-decoration:none}
.legal a:hover{color:var(--ink)}
h1:focus,h2:focus{outline:none}
.opt[aria-pressed="true"] .soft{color:#fff}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="wrap">
  <div class="brand"><a href="/"><span class="dot"></span>Six-Pack Stack</a><span>1:1 coaching application</span></div>
  <main id="app" aria-live="polite"></main>
  <footer class="legal"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/disclaimer">Disclaimer</a></footer>
</div>

<script>
/* ======== SETTINGS ======== */
const KIT_API_KEY = "rWMhWOuYNu8lJKKWoWIfsg";   // Kit PUBLIC API key
const KIT_FORM_ID = "10079550";                  // "Six-Pack Stack Application" form
const KIT_STARTED_TAG = "25211469";              // "app-started" tag: triggers the 1-hour "finish your application" reminder
const BTL_URL     = "https://six-pack-stack.vercel.app/beyond-the-label";         // <-- your Beyond the Label sales page link
const PHOTO_URL   = "/boon.jpg";                          // your headshot
/* ========================= */

const STEPS = [
  {id:"contact", type:"contact", q:"First, where can I reach you?"},
  {id:"stats", type:"stats", q:"Your age, height and current weight"},
  {id:"goal_12_weeks", type:"text", q:"What do you want your body to look like in 12 weeks?", ph:"e.g. Lose my gut, see my top abs, fit into my old jeans"},
  {id:"cost_of_staying", type:"text", q:"What's it costing you to stay where you are right now?", ph:"Confidence, dating, energy, money… be honest, only I read this"},
  {id:"tried_before", type:"multi", q:"What have you already tried that didn't work?", opts:["Fat burners","Pre-workouts","Test boosters","Diets","Apps","Programs","Other"]},
  {id:"monthly_spend", type:"one", q:"About how much do you spend on supplements a month?", opts:["Under $50","$50–$100","$100–$200","$200+"]},
  {id:"train_days", type:"one", q:"How many days a week do you train right now?", opts:["0","1–2","3–4","5+"]},
  {id:"start_timing", type:"one", q:"How soon do you want to start?", opts:["This week","Within 2 weeks","Within a month","Just looking"]},
  {id:"ready_to_invest", type:"one", q:"This is a premium 1:1 program. If we're a fit, are you ready to invest in yourself?", opts:["Yes","Yes, with a payment plan","Not right now"]},
  {id:"medical", type:"medical", q:"Any medical conditions, injuries or medications?"}
];
const A = {name:"",email:"",phone:"",age:"",height:"",current_weight:"",tried:new Set(),medicalYes:null,medicalText:""};
let step = 0;
/* Lead source: ?src=video-name (or utm_source) from a video link, remembered for this visitor */
const LEAD_SOURCE = (()=>{ let v=""; try{ const q=new URLSearchParams(location.search); v=q.get("src")||q.get("utm_source")||""; if(v) localStorage.setItem("sps_src",v); else v=localStorage.getItem("sps_src")||""; }catch(e){} if(!v){ try{ v=document.referrer?new URL(document.referrer).hostname:""; }catch(e){} } return (v||"direct").slice(0,80); })();
/* Prefill from the reminder email link: /apply?name=...&email=... */
(()=>{ try{ const q=new URLSearchParams(location.search); const n=q.get("name"), m=q.get("email"); if(n&&!/[{}]/.test(n)) A.name=n; if(m&&!/[{}]/.test(m)) A.email=m; if(A.name||A.email) step=1; }catch(e){} })();
let startedSent = false;
async function startedToKit(){
  if(startedSent) return; startedSent=true;
  try{ await fetch(`https://api.convertkit.com/v3/tags/${KIT_STARTED_TAG}/subscribe`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({api_key:KIT_API_KEY,email:A.email,first_name:A.name,fields:{lead_source:LEAD_SOURCE}})}); }catch(e){}
}
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function go(n){ step=n; render(); window.scrollTo({top:0,behavior:"smooth"}); const h=app.querySelector("h1,h2"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }
function progress(i){ const pct=Math.round(((i+1)/STEPS.length)*100); return `<div class="progress"><div class="qmeta"><span>Question ${i+1} of ${STEPS.length}</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`; }
function nav(label="Next →"){ return `<div class="err" id="err" role="alert"></div><div class="navrow"><button class="btn ghost" id="back" type="button">←</button><button class="btn" id="next" type="submit">${label}</button></div>`; }
function bindBack(){ const b=document.getElementById("back"); if(b) b.onclick=()=>go(step-1); }
function fail(msg){ document.getElementById("err").textContent=msg; }

function render(){
  if(step===0) return renderIntro();
  if(step===STEPS.length+1) return renderDone();
  const S=STEPS[step-1], i=step-1;
  if(S.type==="contact") return renderContact(i);
  if(S.type==="stats") return renderStats(i);
  if(S.type==="text") return renderText(S,i);
  if(S.type==="multi") return renderMulti(S,i);
  if(S.type==="one") return renderOne(S,i);
  if(S.type==="medical") return renderMedical(S,i);
}

function renderIntro(){
  app.innerHTML=`
  <section class="screen stack" style="margin-top:40px;gap:22px">
    <h1>Apply for the <em>Six-Pack Stack</em></h1>
    <p style="font-size:20px;font-weight:600">Lose 10–15 lbs of fat and finally see your abs in 12 weeks, or I coach you for free until you do.</p>
    <div class="me">${PHOTO_URL?`<img src="${PHOTO_URL}" alt="Boon Fay">`:`<div></div>`}<p class="soft small"><b style="color:#1b2440">I read every application myself.</b> Answer honestly. The more you tell me, the better I can tell you exactly what I'd change.</p></div>
    <p style="font-weight:800">Here's what happens next:</p>
    <ol class="next">
      <li><div><b>Apply:</b> <span class="soft">10 quick questions. About 2 minutes.</span></div></li>
      <li><div><b>Get reviewed:</b> <span class="soft">I personally read it, within 24 hours.</span></div></li>
      <li><div><b>Get approved:</b> <span class="soft">you get a short video I recorded about your current stack, plus a link to claim your spot.</span></div></li>
    </ol>
    <div class="stack" style="gap:10px"><button class="btn" id="start">Start my application →</button>
    <div class="micro"><span>Takes 2 minutes</span><span>No sales call</span><span>No payment now</span></div></div>
  </section>`;
  document.getElementById("start").onclick=()=>go(1);
}

function renderContact(i){
  app.innerHTML=`${progress(i)}<form class="screen stack" id="f" novalidate>
    <h2>${esc(STEPS[i].q)}</h2>
    <div class="field"><label for="name">First name</label><input id="name" autocomplete="given-name" value="${esc(A.name)}"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" value="${esc(A.email)}"></div>
    <div class="field"><label for="phone">Phone number <span style="font-weight:400;opacity:.7">(optional)</span></label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(A.phone)}"></div>
    ${nav()}</form>`;
  document.getElementById("back").onclick=()=>go(0);
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    A.name=document.getElementById("name").value.trim(); A.email=document.getElementById("email").value.trim(); A.phone=document.getElementById("phone").value.trim();
    if(!A.name) return fail("Add your first name.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(A.email)) return fail("Enter a valid email so I can send your video.");
    if(A.phone && A.phone.replace(/\D/g,"").length<7) return fail("That phone number looks too short. Fix it or leave it blank.");
    startedToKit();
    go(step+1);};
}

function renderStats(i){
  app.innerHTML=`${progress(i)}<form class="screen stack" id="f" novalidate>
    <h2>${esc(STEPS[i].q)}</h2>
    <div class="row3">
      <div class="field"><label for="age">Age</label><input id="age" inputmode="numeric" value="${esc(A.age)}" placeholder="e.g. 26"></div>
      <div class="field"><label for="height">Height</label><input id="height" value="${esc(A.height)}" placeholder="e.g. 5'11&quot;"></div>
      <div class="field"><label for="weight">Weight (lbs)</label><input id="weight" inputmode="numeric" value="${esc(A.current_weight)}" placeholder="e.g. 205"></div>
    </div>
    <p class="hint">You must be 18 or older to apply.</p>
    ${nav()}</form>`;
  bindBack();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    A.age=document.getElementById("age").value.trim(); A.height=document.getElementById("height").value.trim(); A.current_weight=document.getElementById("weight").value.trim();
    const ag=parseInt(A.age,10);
    if(!ag) return fail("Add your age.");
    if(ag<18) return fail("The Six-Pack Stack is for guys 18 and older. Thanks for your interest.");
    if(!A.height) return fail("Add your height.");
    if(!A.current_weight) return fail("Add your current weight.");
    go(step+1);};
}

function renderText(S,i){
  app.innerHTML=`${progress(i)}<form class="screen stack" id="f" novalidate>
    <h2>${esc(S.q)}</h2>
    <div class="field"><label for="t" class="hint" style="font-weight:600">A sentence or two is perfect.</label><textarea id="t" placeholder="${esc(S.ph)}">${esc(A[S.id]||"")}</textarea></div>
    ${nav()}</form>`;
  bindBack();
  document.getElementById("f").onsubmit=e=>{e.preventDefault();
    const v=document.getElementById("t").value.trim(); if(v.length<3) return fail("Write a quick answer. Even one sentence helps.");
    A[S.id]=v; go(step+1);};
}

function renderMulti(S,i){
  app.innerHTML=`${progress(i)}<form class="screen stack" id="f" novalidate>
    <h2>${esc(S.q)}</h2><p class="soft">Tick all that apply.</p>
    <div class="chips">${S.opts.map((o,k)=>`<label class="chk"><input type="checkbox" id="m${k}" value="${esc(o)}" ${A.tried.has(o)?"checked":""}><span class="box"></span><span>${esc(o)}</span></label>`).join("")}</div>
    ${nav()}</form>`;
  bindBack();
  app.querySelectorAll(".chk input").forEach(c=>c.onchange=()=>{c.checked?A.tried.add(c.value):A.tried.delete(c.value);});
  document.getElementById("f").onsubmit=e=>{e.preventDefault(); if(!A.tried.size) return fail("Tick at least one. \"Other\" works too."); go(step+1);};
}

function renderOne(S,i){
  const cur=A[S.id];
  app.innerHTML=`${progress(i)}<section class="screen stack">
    <h2>${esc(S.q)}</h2>
    <div class="opts">${S.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${cur===o}"><span>${esc(o)}</span><span class="soft">→</span></button>`).join("")}</div>
    <div><button class="link" id="back">← Back</button></div></section>`;
  bindBack();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[S.id]=S.opts[+b.dataset.k];app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");setTimeout(()=>go(step+1),160);});
}

function renderMedical(S,i){
  app.innerHTML=`${progress(i)}<form class="screen stack" id="f" novalidate>
    <h2>${esc(S.q)}</h2>
    <div class="opts">
      <button type="button" class="opt" id="mNo" aria-pressed="${A.medicalYes===false}"><span>No</span></button>
      <button type="button" class="opt" id="mYes" aria-pressed="${A.medicalYes===true}"><span>Yes</span></button>
    </div>
    <div class="field" id="mBox" ${A.medicalYes?"":"hidden"}><label for="mt">Briefly, what is it?</label><textarea id="mt" style="min-height:90px">${esc(A.medicalText)}</textarea>
      <p class="hint">If you have a medical condition, you'll need your doctor's OK before starting. I'll build your plan around their advice.</p></div>
    ${nav("Submit my application →")}</form>`;
  bindBack();
  const setM=v=>{A.medicalYes=v;document.getElementById("mNo").setAttribute("aria-pressed",String(v===false));document.getElementById("mYes").setAttribute("aria-pressed",String(v===true));document.getElementById("mBox").hidden=!v;};
  document.getElementById("mNo").onclick=()=>setM(false);
  document.getElementById("mYes").onclick=()=>setM(true);
  document.getElementById("f").onsubmit=async e=>{e.preventDefault();
    if(A.medicalYes===null) return fail("Choose No or Yes.");
    A.medicalText=A.medicalYes?document.getElementById("mt").value.trim():"";
    if(A.medicalYes && A.medicalText.length<2) return fail("Add a quick note about it.");
    const btn=document.getElementById("next"); btn.disabled=true; btn.textContent="Sending…";
    await sendToKit(); go(step+1);};
}

async function sendToKit(){
  const fields={phone:A.phone,age:A.age,height:A.height,current_weight:A.current_weight,goal_12_weeks:A.goal_12_weeks||"",cost_of_staying:A.cost_of_staying||"",
    tried_before:[...A.tried].join(", "),monthly_spend:A.monthly_spend||"",train_days:A.train_days||"",start_timing:A.start_timing||"",ready_to_invest:A.ready_to_invest||"",
    medical:A.medicalYes?("Yes: "+A.medicalText):"No",lead_source:LEAD_SOURCE};
  try{
    const r=await fetch(`https://api.convertkit.com/v3/forms/${KIT_FORM_ID}/subscribe`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({api_key:KIT_API_KEY,email:A.email,first_name:A.name,fields})});
    if(r.ok) return true; throw new Error("api");
  }catch(e){
    try{ const fd=new FormData(); fd.append("email_address",A.email); fd.append("fields[first_name]",A.name);
      Object.entries(fields).forEach(([k,v])=>fd.append(`fields[${k}]`,v));
      await fetch(`https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions`,{method:"POST",mode:"no-cors",body:fd}); return true;
    }catch(e2){ return false; }
  }
}

function renderDone(){
  const notReady = A.start_timing==="Just looking" || A.ready_to_invest==="Not right now";
  app.innerHTML=`<section class="done">
    <div class="check" aria-hidden="true">✓</div>
    <h2>Got it, ${esc(A.name)}. Your application is in.</h2>
    <p class="soft" style="max-width:32em">I read every application myself, within 24 hours. Watch your inbox at <b style="color:#1b2440">${esc(A.email)}</b>. If you're a fit, you'll get a short video I recorded about your stack and a link to claim your spot.</p>
    <div class="card stack" style="gap:10px">
      <b>While you wait:</b>
      <p class="soft small">Check your spam or promotions folder and move my email to your main inbox, so you don't miss your video.</p>
    </div>
    ${notReady?`<div class="card stack" style="gap:10px"><b>Not ready to start yet?</b><p class="soft small">Start with my app. It builds your calories, meals and workouts in 2 minutes, and your first 2 weeks are free.</p><a class="btn" href="/free-stack?src=apply-not-ready">Build My Free Plan →</a></div>`:""}
    <a class="link" href="/">← Back to the Six-Pack Stack</a>
  </section>`;
}

render();
</script>

</body>
</html>
