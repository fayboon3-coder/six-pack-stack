<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apply: The Six-Pack Stack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
:root{--navy:#0d1b33;--navy-2:#142645;--line:#2b4470;--white:#fff;--soft:#e3e9f2;--red:#e2433b;--red-2:#ff5a50;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--white);margin:0}
body{font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:18px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:620px;margin:0 auto;padding-block:80px;display:flex;flex-direction:column;gap:22px;text-align:center}
h1{font-weight:900;font-size:clamp(32px,7vw,48px);line-height:1.08;margin:0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red-2)}
p{margin:0;color:var(--soft)}
.btn{display:block;background:var(--red);color:#fff;text-decoration:none;font-weight:900;text-transform:uppercase;letter-spacing:.03em;padding:20px;border-radius:6px}
.btn:hover{background:var(--red-2)}
a.back{color:var(--soft)}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Applications open <em>very soon</em></h1>
  <p>The Six-Pack Stack application is being set up right now. In the meantime, find out exactly what to cut, keep and swap in your stack.</p>
  <a class="btn" href="/stack-score">Get My Free Stack Score →</a>
  <a class="back" href="/">← Back to the Six-Pack Stack</a>
</div>
</body>
</html>
