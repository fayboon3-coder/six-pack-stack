<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The free 60-second audit of how you lift, how you eat and what you take, with exactly what to tweak to hit your goal. By Boon Fay.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="What's your Stack Score?">
<meta property="og:description" content="Free 60-second audit of your training, eating and supplements, with exactly what to tweak to hit your goal.">
<meta property="og:image" content="https://boonfay.com/og-coaching.jpg">
<link rel="icon" href="/logo-b.png">
<script src="/t.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>

/* Stack Score: the same look as the app landing page (light grey hero, white sections, navy ink, Six-Pack Stack red, Inter).
   One deliberate light theme, every color set explicitly so it reads the same on any host. */
:root{
  --bg:#f3f4f8;--card:#ffffff;--ink:#141c33;--ink2:#2b3450;--mute:#4a5470;--soft:#8a92a8;--line:#e6e8ef;--line2:#d7dbe6;
  --red:#d0362f;--red-h:#b92d27;--red-bg:#fdf0ef;--green:#1f9d5f;--green-bg:#e9f7f0;--amber:#b7800a;--amber-bg:#fdf5e3;
  --shadow:0 1px 2px rgba(20,28,51,.05),0 8px 24px rgba(20,28,51,.07);
  --shadow-lg:0 2px 4px rgba(20,28,51,.06),0 24px 60px rgba(20,28,51,.16);
  --f:"Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--ink)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
img{max-width:100%}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.in{max-width:1104px;margin:0 auto}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:21}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.logo img{width:30px;height:30px;border-radius:8px}
.logo span{color:var(--red)}
.top .by{font-size:13px;color:var(--mute);font-weight:600}
.top .by b{color:var(--ink)}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--f);font-weight:800;font-size:17px;background:var(--red);color:#fff;height:56px;padding:0 26px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;box-shadow:0 10px 24px rgba(208,54,47,.28);transition:background .15s,transform .15s,box-shadow .15s;line-height:1.2;text-align:center}
.btn:hover{background:var(--red-h);color:#fff;transform:translateY(-1px);box-shadow:0 14px 28px rgba(208,54,47,.32)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line2);box-shadow:none}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.sm{height:46px;font-size:15px;padding:0 18px}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible,.chk:focus-within,.link:focus-visible,input:focus-visible,.more:focus-visible,summary:focus-visible{outline:3px solid rgba(208,54,47,.45);outline-offset:2px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.micro{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;font-weight:600;color:var(--mute)}
.micro span::before{content:"✓ ";color:var(--green);font-weight:900}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--mute)}
.small{font-size:14px}

/* ---------- hero (like the app landing page) ---------- */
.hero{position:relative;overflow:hidden;background:var(--bg)}
.hero .in{position:relative;z-index:2;display:flex;align-items:center;min-height:720px}
.hero-text{max-width:430px;display:flex;flex-direction:column;gap:18px;padding:72px 0}
.hero h1{font-size:56px;line-height:1.04;font-weight:900}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .sub{font-size:19px;line-height:1.5;color:var(--ink2)}
.hero .sub b{color:var(--ink)}
.built{display:flex;align-items:center;gap:12px;margin-top:6px}
.built img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow)}
.built>div{text-align:left}
.built b{display:block;font-size:14px}
.built span{display:block;font-size:13px;color:var(--mute)}
.wall{position:absolute;top:0;bottom:0;right:0;left:calc(50% + 10px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow:hidden;z-index:1}
.wall::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0%,rgba(243,244,248,0) 22%),linear-gradient(0deg,var(--bg) 0%,rgba(243,244,248,0) 18%),linear-gradient(180deg,var(--bg) 0%,rgba(243,244,248,0) 12%)}
.wall .col{overflow:hidden}
.wall .track{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:8px;overflow:hidden;background:#fff}
.pair img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.up{animation:up 44s linear infinite}.down{animation:down 50s linear infinite}
.mwall{display:none}

/* floating score card over the wall */
.float{position:absolute;z-index:3;left:calc(50% + 70px);top:50%;width:300px;transform:translateY(-50%) rotate(-3deg);animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-50%) rotate(-3deg)}50%{transform:translateY(calc(-50% - 12px)) rotate(-2deg)}}
.scard{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px;border:1px solid rgba(20,28,51,.06)}
.scard .row{display:flex;align-items:center;gap:14px}
.scard .mini{position:relative;width:76px;height:76px;flex:none}
.scard .mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.scard .mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:900}
.scard .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.scard .band{font-size:18px;font-weight:900}
.bars{display:grid;gap:9px}
.bars div{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.bars i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bars i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);border-radius:99px;background:var(--c)}
.bars em{font-style:normal;text-align:right;color:var(--mute)}
.scard .tw{background:var(--red-bg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.scard .tw b{color:var(--red)}

/* ---------- sections ---------- */
.sec{background:#fff;padding-block:96px}
.sec.alt{background:var(--bg)}
.sec h2{font-size:40px;line-height:1.12;font-weight:900}
.sec .lead{font-size:18px;color:var(--mute);max-width:36em}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.grid2>*{min-width:0}
.bullets{list-style:none;padding:0;margin:24px 0 28px;display:grid;gap:16px}
.bullets li{display:flex;gap:14px;align-items:flex-start;font-size:17px;color:var(--ink2)}
.bullets li b{color:var(--ink)}
.tick{flex:none;width:26px;height:26px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff;margin-top:1px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.sec.alt .card{border-color:transparent}
.card .n{width:40px;height:40px;border-radius:12px;background:var(--red-bg);color:var(--red);display:grid;place-items:center;font-weight:900;font-size:18px}
.card b{font-size:19px;font-weight:800}
.card p{color:var(--mute);font-size:15px}
.me{display:grid;grid-template-columns:380px 1fr;gap:56px;align-items:center}
.me .ph{border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);aspect-ratio:4/5;background:var(--red)}
.me .ph img{width:100%;height:100%;object-fit:cover;display:block}
.me h2{margin-bottom:14px}
.me p{font-size:17px;color:var(--ink2);margin-bottom:14px}
.faq{display:grid;gap:12px;max-width:760px;margin:40px auto 0;width:100%;text-align:left}
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.faq summary{cursor:pointer;font-size:16px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--red);font-weight:900}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:10px;color:var(--mute);font-size:15px}
.final{background:var(--ink);color:#fff;padding-block:88px;text-align:center}
.final h2{font-size:40px;color:#fff;font-weight:900}
.final p{color:#c7cde0;font-size:18px}
.final .micro{color:#c7cde0;justify-content:center}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);font-size:13px;font-weight:600}
.legal a{color:var(--mute);text-decoration:none}
.legal a:hover{color:var(--ink)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.on{opacity:1;transform:none}

/* example label */
.facts{background:#fff;color:var(--ink);border:2px solid var(--ink);padding:14px 16px 16px;border-radius:6px;box-shadow:var(--shadow-lg)}
.facts .ft{font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1;border-bottom:1px solid var(--ink);padding-bottom:6px}
.facts .serv{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:8px solid var(--ink)}
.scoreline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px;border-bottom:4px solid var(--ink)}
.scoreline .lbl{font-weight:900;font-size:20px}
.scoreline .band{font-weight:600;font-size:15px}
.bignum{font-weight:900;font-size:60px;line-height:.9;letter-spacing:-.03em}
.bignum span{font-size:20px}
.vhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-block:6px;border-bottom:1px solid var(--ink)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:10px;border-bottom:1px solid #d9dde6}
.vrow .nm{font-weight:800;min-width:0}
.vrow .why{grid-column:1 / -1;font-size:14px;color:var(--mute);line-height:1.45}
.vrow .why b{color:var(--ink)}
.vrow .go{grid-column:1 / -1;font-size:14px;font-weight:800;color:var(--red);text-decoration:none;justify-self:start}
.vrow .go:hover{text-decoration:underline}
.pill{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:5px;white-space:nowrap;align-self:start}
.p-worth{background:var(--green-bg);color:#13633d}
.p-situational{background:var(--amber-bg);color:#7a5408}
.p-skip{background:#fde2e0;color:#a3221b}
.p-risk{background:#a3221b;color:#fff}
.trow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--ink);font-weight:800}
.trow:last-of-type{border-bottom:8px solid var(--ink)}
.trow .v{text-align:right}
.foot{font-size:12px;color:var(--mute);padding-top:8px}

/* ---------- quiz ---------- */
.quiz{min-height:calc(100vh - 61px);padding-block:28px 0}
.qwrap{max-width:620px;margin:0 auto}
.progress{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--mute)}
.qmeta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;width:0;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.qcard{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:22px;border:1px solid var(--line)}
.qcard h2{font-size:30px;line-height:1.15;font-weight:900}
.hint{color:var(--mute);font-size:16px;margin-top:-10px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--ink);transform:translateY(-1px)}
.opt small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:2px}
.opt .arrow{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;color:transparent;transition:all .15s}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-bg)}
.opt[aria-pressed="true"] .arrow{background:var(--red);border-color:var(--red);color:#fff}
.qblock{display:flex;flex-direction:column;gap:10px}
.qblock>b{font-size:16px;font-weight:800}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;cursor:pointer;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:99px;padding:10px 16px;line-height:1.25;transition:all .15s}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(208,54,47,.25)}
.search{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink);background:#fff}
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line2);background:#fff;border-radius:99px;padding:9px 14px;font-size:15px;font-weight:600;user-select:none;max-width:100%;line-height:1.25;transition:all .15s}
.chk:hover{border-color:var(--ink)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;line-height:1;color:#fff}
.chk:has(input:checked){border-color:var(--red);background:var(--red-bg)}
.chk:has(input:checked) .box{background:var(--red);border-color:var(--red)}
.chk:has(input:checked) .box::after{content:"✓"}
.chk .via{font-size:12px;color:var(--mute);font-weight:500}
.more{appearance:none;background:var(--bg);border:1.5px dashed var(--line2);color:var(--ink);font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:12px;cursor:pointer;width:100%}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700;font-size:15px}
.field input{width:100%;font:inherit;font-size:17px;padding:15px 16px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(20,28,51,.06)}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:1.2em}
.sticky-next{position:sticky;bottom:0;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(243,244,248,0));display:flex;gap:12px;align-items:center;margin-top:6px;z-index:5}
.sticky-next .btn{flex:1}
.sticky-next .btn.ghost{flex:none;width:56px;padding:0}
.g2{display:flex;flex-direction:column;gap:18px}
.gate2{max-width:560px}
.g2-top{display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.g2-k{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green);background:var(--green-bg);border-radius:999px;padding:7px 12px}
.g2-k i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.g2 h2{font-size:34px;line-height:1.08;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.g2-sub{color:var(--mute);font-size:16px;line-height:1.5;margin:0;max-width:44ch}
.g2-preview{position:relative;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:linear-gradient(150deg,#141c33,#1d2a52 70%,#2a1530);color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow-lg);overflow:hidden}
.g2-ring{position:relative;width:118px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.g2-ring svg{position:absolute;inset:0;width:100%;height:100%}
.g2-ring b{position:relative;font-size:36px;font-weight:900;line-height:1;filter:blur(1px)}
.g2-ring span{position:relative;font-size:11px;color:#9aa3bd}
.g2-areas{display:grid;gap:9px;min-width:0}
.g2-a{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:14px;color:#c7cde0}
.g2-a i{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.g2-a u{display:block;height:100%;width:60%;background:linear-gradient(90deg,#ff5a50,#ffb020);filter:blur(2px)}
.g2-a:nth-child(2) u{width:42%}.g2-a:nth-child(3) u{width:75%}
.g2 .blur{filter:blur(6px);user-select:none}
.g2-tweak{display:flex;gap:10px;white-space:nowrap;align-items:baseline;font-size:14px;color:#c7cde0;margin-top:4px;min-width:0}
.g2-tweak b{color:#fff;white-space:nowrap;overflow:hidden}
.g2-lock{grid-column:1 / -1;justify-self:center;background:#fff;color:var(--ink);font-weight:800;font-size:12px;border-radius:999px;padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.g2-facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2-facts li{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;text-align:center}
.g2-facts b{font-size:28px;font-weight:900;color:var(--red);line-height:1}
.g2-facts span{font-size:13px;line-height:1.35;color:var(--ink2)}
.g2-facts em{font-style:normal;font-weight:800;color:var(--red)}
.g2-form{display:flex;flex-direction:column;gap:12px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-lg)}
.g2-ask{font-size:19px;font-weight:900;margin:0;color:var(--ink)}
.g2-btn{height:60px;font-size:19px}
.g2-fine{font-size:13px;color:var(--soft);text-align:center;margin:0}
.g2-boon{display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--mute)}
.g2-boon img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--red)}
.g2-boon b{color:var(--ink)}
@media (max-width:560px){

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function match(p,f){
  if(!f) return {ok:true};
  if(norm(p.n+" "+p.full).includes(f)) return {ok:true};
  const hit=p.a.find(a=>norm(a).includes(f)||(f.length>3&&f.includes(norm(a))));
  return hit?{ok:true,via:hit}:{ok:false};
}

function tone(s){ return s<50?"low":s<75?"mid":"high"; }

function liftArea(a,g){
  let s=100; const T=[], good=[];
  const muscle = g==="muscle"||g==="recomp", lean = g==="fat"||g==="cut";
  if(a.days==="0–1"){ s-=40; T.push({p:40,t:"Train 3 days a week, full body",b:"Three 45-minute sessions that hit every muscle. That's the minimum that "+(lean?"holds on to your muscle while the fat comes off.":"starts building muscle you can see."),w:"Consistency beats intensity. 3 days you never miss is better than 5 you can't keep."}); }
  else if(a.days==="2–3"){
    if(muscle){ s-=25; T.push({p:25,t:"Add a 4th day",b:"Switch to an upper/lower split, 4 days a week. More quality sets per muscle each week is the biggest lever for growth once you're showing up.",w:"Each muscle gets trained twice a week instead of once."}); }
    else { s-=10; T.push({p:10,t:"Make every session full body",b:"With 2–3 days, hit every major muscle each session: a squat or leg press, a hinge, a push and a pull.",w:"That's how you keep your muscle while you diet, so you look lean, not just smaller."}); }
  } else good.push("You train 4+ days a week. That's the hardest part, done.");

  if(a.style==="Mostly cardio or classes"){ s-=30; T.push({p:30,t:"Swap 2 cardio sessions for weights",b:"Cardio burns calories, but lifting decides what you look like when the fat is gone. Keep the walks, trade the classes.",w:lean?"Without lifting, a big chunk of the weight you lose can be muscle.":"You can't build muscle without a reason to: heavy-ish weights."}); }
  else if(a.style==="Weights, I wing it"){ s-=15; T.push({p:15,t:"Run one plan for 8 weeks",b:"Same exercises in the same order every week. Change the weight and reps, not the workout.",w:"You can't beat last week's numbers if last week was a different workout."}); }
  else if(a.style==="I don't train yet"){ s-=35; T.push({p:35,t:"Start with 6 basic moves",b:"A squat, a hinge, a push, a pull, a lunge and a carry. Learn them light with clean form, then add weight every week.",w:"Beginners grow fastest. Your first 6 months are the best gains you'll ever get."}); }
  else good.push("You follow a set plan.");

  if(a.prog==="Not really"||a.prog==="Sometimes"){ const d=a.prog==="Not really"?20:10; s-=d; T.push({p:d,t:"Beat last week by one rep",b:"Log every set. When you hit the top of your rep range on every set, add 5 lbs next time.",w:"That's progressive overload. If the weights don't go up, your muscles have no reason to change."}); }
  else if(a.prog) good.push("Your lifts go up because you track them.");

  if(lean) T.push({t:"Walk 8,000–10,000 steps a day",b:"Get them in short walks: after meals, on calls, parking further away.",w:"Over a week, steps burn more than most cardio sessions, without making you hungrier or hurting your recovery."});
  if(muscle && T.length<2) T.push({t:"Push most sets close to failure",b:"Finish most sets with 1–2 good reps left in the tank. If you could've done 5 more, the set didn't count for much.",w:"Effort per set matters more than the number of exercises."});
  return {key:"lift",name:"Lifting",score:clamp(s,10,100),tweaks:T.slice(0,3),good};
}

function eatArea(a,g){
  let s=100; const T=[], good=[], lean=g==="fat"||g==="cut";
  if(a.protein!=="Yes"){
    const d={"Sometimes":15,"No":30,"No idea how much I need":25}[a.protein]||0; s-=d;
    T.push({p:d,t:"Hit your protein every day",b:"Aim for about 0.7–1g per pound of your goal body weight. For most guys that's 140–180g. Build every meal around a protein first.",w:lean?"It protects your muscle while you diet and keeps you full, so the deficit is easier.":"It's the raw material for new muscle. Train hard without it and you're leaving gains on the table."});
  } else good.push("You hit your protein. That's the habit most guys miss.");
  if(a.cals!=="Yes, I track"){
    const dc=a.cals==="No idea"?25:10; s-=dc;
    const c={fat:{t:"Eat 400–500 calories under maintenance",b:"That's about 1 lb a week. Track for just 2 weeks to learn what your portions really are. You don't have to do it forever."},
             cut:{t:"Eat about 300 calories under maintenance",b:"Slow and steady for the last few pounds, about half a pound a week, so you keep your muscle and your abs show."},
             muscle:{t:"Eat 200–300 calories over maintenance",b:"A small surplus builds muscle without piling on fat. If the scale climbs more than 1 lb a month (beginners: 2 lbs), pull back."},
             recomp:{t:"Eat about 200 calories under maintenance",b:"A small deficit plus high protein and heavy lifting lets you lose fat and build muscle at the same time."}}[g];
    T.push({...c,p:dc,w:a.cals==="Roughly"?"Roughly is close, but small misses add up over weeks. Know the number and the results get predictable.":"If you don't know your number, you're guessing. Most guys underestimate what they eat by a lot."});
  } else good.push("You know your calories.");
  if(a.weekend!=="On track"){
    const dw=a.weekend==="I undo the whole week"?25:10; s-=dw;
    T.push({p:dw,t:"Plan 2 meals out on the weekend",b:"Pick them ahead of time and keep the rest of the weekend like a weekday.",w:"Two loose days can wipe out five good ones. That's usually why the scale doesn't move."});
  } else good.push("Your weekends are on track.");
  if(a.out!=="Rarely"){
    const dout=a.out==="Most meals"?15:5; s-=dout;
    T.push({p:dout,t:"Pick 3 go-to orders",b:"One for each place you go most. Think a burrito bowl with double chicken, or grilled nuggets with a side salad. Decide before you walk in.",w:"When you've already decided, the menu doesn't decide for you."});
  }
  if(!T.length) T.push({t:"Re-check your calories every 4 weeks",b:"As your body changes, so does your maintenance. A small reset keeps the progress going.",w:"This is how you avoid the plateau."});
  const targets = [`Protein: 0.7–1g per lb of goal weight`, {fat:"Calories: 400–500 under maintenance",cut:"Calories: ~300 under maintenance",muscle:"Calories: 200–300 over maintenance",recomp:"Calories: ~200 under maintenance"}[g]];
  return {key:"eat",name:"Eating",score:clamp(s,10,100),tweaks:T.slice(0,3),good,targets};
}

function overall(l,e,s,g){ const w=(g==="muscle")?{l:.45,e:.35,s:.20}:{l:.35,e:.45,s:.20}; return clamp(l*w.l+e*w.e+s*w.s,10,98); }
function computeResult(){
  const a=state.a, g=a.goal||"cut";

  const score = overall(L.score,E.score,S.score,g);
  const up = A => Math.min(100, A.score + A.tweaks.reduce((x,t)=>x+(t.p||0),0));
  // #1 tweak: first tweak of the weakest area (eating wins ties for fat loss, lifting for muscle)
  const areas=[L,E,S];
  const weakest = areas.slice().sort((x,y)=>x.score-y.score || (g==="muscle"?(x.key==="lift"?-1:1):(x.key==="eat"?-1:1)))[0];
  const top = weakest.tweaks[0];
  const bump = A => A===weakest ? Math.min(100,A.score+(top.p||0)) : A.score;
  const pot1 = Math.max(score, overall(bump(L),bump(E),bump(S),g));
  const potAll = Math.max(pot1, overall(up(L),up(E),up(S),g));
  let band, bandText;

}
function gradRing(id,size,stroke,score){
  const r=(size-stroke)/2, C=2*Math.PI*r, t=tone(score), c1={low:"#ff5a50",mid:"#ffb020",high:"#2fd17f"}[t], c2={low:"#ff9a6b",mid:"#ffe08a",high:"#8af0bd"}[t];
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${stroke}"/>
    <circle id="${id}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id}g)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-c="${C}" data-s="${score}"/></svg>`;
}
function renderResults(){
  const r=state.result||computeResult();
  const g=GOALS.find(x=>x.v===state.a.goal);
  const today=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  const planBtn=(label,cls="")=>`<a class="btn full ${cls}" href="${PLAN_URL}">${label}</a>`;
  const potRow=(label,val,cls)=>`<div class="pot-row ${cls}"><div><span>${label}</span><b data-count="${val}">0</b></div><i><u style="--w:${val}%"></u></i></div>`;
  const tabs=[r.L,r.E,r.S];
  const first=r.weakest.key;
  app.innerHTML = `<div class="report">
  <section class="rhead">
    <div class="rh-bg" aria-hidden="true"></div>
    <div class="in gut rh-in">
      <div class="rh-left pop">
        <div class="rh-meta"><span>Stack Score report</span><span>${esc(state.name)}</span><span>${today}</span>${g?`<span>Goal: ${esc(g.t.toLowerCase())}</span>`:""}</div>
        <div class="rh-score">
          <div class="big-ring">${gradRing("mainArc",220,16,r.score)}<div class="br-num"><b id="sc">0</b><span>out of 100</span></div></div>
          <div class="rh-copy">
            <span class="rband b-${r.tone}">${esc(r.band)}</span>
            <h1>${esc(state.name)}, your Stack Score is <em>${r.score}</em>.</h1>
            <p>${esc(r.bandText)}</p>
          </div>
        </div>
      </div>
      <div class="rh-right pop" style="animation-delay:.2s">
        <div class="pot">
          <span class="eyebrow" style="color:#ff8a82">Your potential</span>
          <p class="pot-h">Where your score goes when you make the tweaks</p>
          ${potRow("Today",r.score,"now")}
          ${potRow("Do your #1 tweak",r.pot1,"one")}
          ${potRow("Do all your tweaks",r.potAll,"all")}
          ${planBtn("Build my free plan →")}
          <p class="pot-f">Your free plan walks you through every tweak, built from your answers.</p>
        </div>
      </div>
    </div>
  </section>

  <div class="in gut rbody">
    <div class="prio pop" style="animation-delay:.35s">
      <div class="prio-ico" aria-hidden="true">🎯</div>
      <div>
        <span class="eyebrow">Your #1 tweak · ${esc(r.weakest.name)}</span>
        <span class="t">${esc(r.top.t)}</span>
        <p>${esc(r.top.b)}</p>
        <p class="small muted">Why: ${esc(r.top.w)}</p>
      </div>
      <span class="prio-gain">+${Math.max(1,r.pot1-r.score)}<small>points</small></span>
    </div>


    <div class="tabs pop" style="animation-delay:.45s" role="tablist" aria-label="Your breakdown">
      ${tabs.map(A=>`<button role="tab" data-tab="${A.key}" aria-selected="${A.key===first}"><span class="tring">${ring(A.score,44,5)}<b>${A.score}</b></span><span class="tl">${A.name}</span></button>`).join("")}
    </div>
    <div class="panels">
      ${tabs.map(A=>`<div class="panel" role="tabpanel" data-panel="${A.key}" ${A.key===first?"":"hidden"}>${areaCard(A, A.key==="supp"?verdictLabel(r.S):"", 0)}</div>`).join("")}
    </div>

    <section class="appad pop" style="animation-delay:.2s" aria-label="Your next step: the Six-Pack Stack app">
      <div class="aa-glow" aria-hidden="true"></div>
      <div class="aa-copy">
        <span class="aa-k"><i></i>Your next step · free</span>
        <h2>${esc(state.name)}, here's your plan to go from <em>${r.score}</em> to <em>${r.potAll}</em>.</h2>
        <p class="aa-sub">My Six-Pack Stack app turns this report into your full 12-week plan to ${esc(GOAL_TEXT[state.a.goal]||"hit your goal")}, built from the answers you just gave me.</p>
        <ul class="aa-list">
          <li><span>🎯</span><div><b>Your #1 tweak is built into week 1</b><small>${esc(r.top.t)}</small></div></li>
          <li><span>🔎</span><div><b>Scan any supplement before you buy it</b><small>Barcode or label, and you see my verdict right there in the store</small></div></li>
          <li><span>🍳</span><div><b>Meals made only from foods you already eat</b><small>Snap anything else and it logs the calories and protein for you</small></div></li>
          <li><span>🏋️</span><div><b>Workouts on the days you pick</b><small>A form video on every move and today's target, so you get stronger every week</small></div></li>
          <li><span>📉</span><div><b>Calories that adjust to your real trend</b><small>See the date you'll hit your goal, and stop guessing</small></div></li>
        </ul>
        <a class="btn aa-btn" href="${PLAN_URL}">Build my free plan <b aria-hidden="true">→</b></a>
        <div class="aa-micro"><span>2 minutes</span><span>Your answers carry over</span><span>First 2 weeks free, no card</span></div>
      </div>
      <div class="aa-phones" aria-hidden="true">
        <div class="ph3 p-l"><img src="/img/app/lp-scan.jpg" alt="" loading="lazy"></div>
        <div class="ph3 p-r"><img src="/img/app/lp-progress.jpg" alt="" loading="lazy"></div>
        <div class="ph3 p-c"><img src="/img/app/lp-programs.jpg" alt="" loading="lazy"></div>
        <span class="chip c1">✓ Built from your answers</span>
        <span class="chip c2">${r.score} → ${r.potAll}</span>
      </div>
    </section>

    <div class="coachcard pop">
      <img src="/boon.jpg" alt="Boon Fay" width="64" height="64">
      <div class="cc-t">
        <span class="eyebrow">Want me to do it with you?</span>
        <b>1:1 coaching with me. Abs in 12 weeks, or I coach you free until you do.</b>
        <p>I audit your stack, build your plan around your food and your week, and review your check-in every Sunday.${FOUNDING_LINE}</p>
      </div>
      <a class="btn ghost" href="${COACH_URL}">See if you qualify →</a>
    </div>

    <div class="rfoot">
      <div class="share">
        <b>Know someone who needs this?</b>
        <p class="small muted">Send them the audit. It's free and takes 60 seconds.</p>
        <code id="shareurl">${SHARE_URL}</code>
        <button class="btn ghost sm full" id="share">Copy link</button>
      </div>
      <div class="stack-mini">
        <p class="small muted">A copy is on its way to <b style="color:var(--ink)">${esc(state.email)}</b>.${state.sent?"":" Check your promotions tab if you don't see it."}</p>
        <button class="link" id="redo">Retake the audit</button>
      </div>
    </div>
  </div>
  <div class="dock" id="dock" aria-hidden="true"><div class="dock-in"><div><b>${r.score} → ${r.potAll}</b><span>Your plan gets you there</span></div><a class="btn sm" href="${PLAN_URL}" tabindex="-1">Build my free plan →</a></div></div>
  </div>`;

  // animate: main ring, numbers, potential bars
  requestAnimationFrame(()=>{
    app.querySelectorAll("circle[data-c]").forEach(c=>{ c.style.transition=reduce?"none":"stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"; c.style.strokeDashoffset=c.dataset.c*(1-c.dataset.s/100); });
    setTimeout(()=>app.querySelectorAll(".pot u").forEach(u=>u.classList.add("go")),350);
  });
  countTo(document.getElementById("sc"),r.score,1600);
  app.querySelectorAll("[data-count]").forEach((n,i)=>setTimeout(()=>countTo(n,+n.dataset.count,1200),400+i*250));

  // tabs
  app.querySelectorAll("[data-tab]").forEach(t=>t.onclick=()=>{
    app.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
    app.querySelectorAll("[data-panel]").forEach(p=>{ const on=p.dataset.panel===t.dataset.tab; p.hidden=!on; if(on){ p.classList.remove("swap"); void p.offsetWidth; p.classList.add("swap"); } });
  });
  // dock appears once the potential card scrolls away
  const dock=document.getElementById("dock"), pot=app.querySelector(".pot"), ctaBox=app.querySelector(".rbody .appad");
  const vis={pot:true,cta:false,potAbove:false};
  const upd=()=>{ const on=!vis.pot && vis.potAbove && !vis.cta; dock.classList.toggle("on",on); dock.setAttribute("aria-hidden",String(!on)); dock.querySelector("a").tabIndex=on?0:-1; };
  if("IntersectionObserver" in window){
    new IntersectionObserver(es=>es.forEach(e=>{ vis.pot=e.isIntersecting; vis.potAbove=e.boundingClientRect.top<0; upd(); })).observe(pot);
    new IntersectionObserver(es=>es.forEach(e=>{ vis.cta=e.isIntersecting; upd(); })).observe(ctaBox);
  }

  document.getElementById("share").onclick=async e=>{
    const b=e.currentTarget;
    window.spsTrack&&spsTrack("ss_share");
    try{ await navigator.clipboard.writeText(SHARE_URL); b.textContent="Copied ✓"; }
    catch(x){ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("shareurl")); s.removeAllRanges(); s.addRange(rg); b.textContent="Selected. Copy it ✓"; }
    setTimeout(()=>b.textContent="Copy link",2200);
  };
  document.getElementById("redo").onclick=()=>{state.a={};state.picked.clear();state.none=false;state.other="";state.result=null;state.showAll=false;go(0);};
}

render();
</script>
</body>
</html>
