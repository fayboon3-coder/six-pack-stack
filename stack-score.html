<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The free 60-second audit that shows you what to keep, what to skip and how much your supplements are really costing you. By Boon Fay.">
<meta property="og:title" content="What's your Stack Score?">
<meta property="og:description" content="Free 60-second audit: a verdict on every supplement you take, and how much you're wasting a year.">
<meta property="og:image" content="https://six-pack-stack.vercel.app/og-coaching.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* One centered column. The quiz moves screen to screen; the report renders as a "Supplement Facts" label. Single navy brand look, same as the app. */
:root{
  --navy:#0d1b33;--navy-2:#142645;--navy-3:#1d3459;--line:#2b4470;
  --ink:#ffffff;--muted:#c9d3e3;--dim:#93a3bd;
  --red:#e2433b;--red-2:#ff5a50;--keep:#3fbf7f;--warn:#f2b234;
  --label-bg:#ffffff;--label-ink:#0d1b33;--label-mute:#3a4a66;
  --f:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--ink)}
body{font-family:var(--f);font-size:16px;font-weight:500;line-height:1.55;font-variant-numeric:tabular-nums;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 40px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0}
h1{font-size:clamp(38px,10vw,68px);line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red-2)}
h2{font-size:clamp(24px,6.4vw,32px);line-height:1.12;font-weight:900;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red-2)}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--f);font-weight:900;font-size:17px;letter-spacing:.02em;text-transform:uppercase;
  background:var(--red);color:#fff;padding:18px 22px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;transition:background .15s,transform .15s;width:100%;text-align:center;line-height:1.2;
  box-shadow:0 10px 24px -10px rgba(226,67,59,.7)}
.btn:hover{background:var(--red-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--navy-2)}
.btn.sm{font-size:14px;padding:12px 16px}
.btn:focus-visible,.opt:focus-visible,.chk:focus-within,.link:focus-visible,input:focus-visible,.more:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.micro{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.micro span::before{content:"✓ ";color:var(--keep)}

/* start */
.hero{display:flex;flex-direction:column;gap:20px;margin-top:28px}
.sub{font-size:20px;line-height:1.4;max-width:30em}
.sub b{color:#fff}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proof div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof b{font-size:22px;font-weight:900;line-height:1.1}
.proof span{font-size:13px;color:var(--muted);line-height:1.3}
.sec{display:flex;flex-direction:column;gap:18px;padding-top:40px;margin-top:40px;border-top:1px solid var(--line)}
.bullets{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.bullets li{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:22px;height:22px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-weight:900;font-size:20px}
.steps b{display:block;font-size:18px}
.me{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center}
.me img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.faq{display:grid;gap:10px}
.faq div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.faq b{display:block;margin-bottom:2px}

/* quiz */
.progress{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;background:var(--navy-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.screen{margin-top:24px}
.hint{color:var(--muted);font-size:16px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;font-size:18px;font-weight:700;color:var(--ink);
  background:var(--navy-2);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--navy-3)}
.opt .arrow{color:var(--muted)}
.opt small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
.search{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--ink)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line);background:var(--navy-2);border-radius:99px;padding:10px 14px;font-size:15px;font-weight:600;user-select:none;max-width:100%;line-height:1.25}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.chk:has(input:checked){border-color:var(--red);background:var(--navy-3)}
.chk:has(input:checked) .box{background:var(--red);border-color:var(--red);color:#fff}
.chk:has(input:checked) .box::after{content:"✓"}
.chk .via{font-size:12px;color:var(--muted);font-weight:500}
.more{appearance:none;background:none;border:1.5px dashed var(--line);color:var(--ink);font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:12px;cursor:pointer;width:100%}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.picked span{background:var(--red);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px}
.sticky-next{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--navy) 70%,transparent);display:flex;gap:12px;align-items:center;margin-top:8px;z-index:5}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.field input{width:100%;font:inherit;font-size:18px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--ink)}
.err{color:var(--red-2);font-size:15px;min-height:1.2em}

/* gate + calculating */
.gatewrap{position:relative}
.blurred{filter:blur(5px);pointer-events:none;user-select:none;opacity:.85}
.gatewrap .badge{position:absolute;inset:0;display:grid;place-items:center}
.gatewrap .badge span{background:var(--navy);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:800;font-size:15px}
.inside{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.inside li::before{content:"✓  ";color:var(--keep);font-weight:900}
.calc{display:grid;gap:14px;margin-top:8px}
.calc li{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:600;color:var(--dim);transition:color .3s}
.calc li i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;color:#fff;transition:all .3s}
.calc li.on{color:var(--ink)}
.calc li.on i{background:var(--keep);border-color:var(--keep)}
.calc li.on i::after{content:"✓"}

/* results */
.res{display:flex;flex-direction:column;gap:28px}
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 18px;border-radius:22px;background:linear-gradient(180deg,rgba(29,52,89,.9),rgba(20,38,69,.6));border:1px solid var(--line)}
.gauge{position:relative;width:200px;height:200px;max-width:100%}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.gauge .num b{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.gauge .num span{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.bandpill{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.b-low{background:rgba(226,67,59,.18);color:#ff8a82;border:1px solid rgba(226,67,59,.5)}
.b-mid{background:rgba(242,178,52,.15);color:#ffd27a;border:1px solid rgba(242,178,52,.5)}
.b-high{background:rgba(63,191,127,.15);color:#7fe0ae;border:1px solid rgba(63,191,127,.5)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0}
.tiles b{font-size:22px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.tiles span{font-size:12px;color:var(--muted);line-height:1.3;font-weight:600}
.tiles .hot b{color:var(--red-2)}
.leak{border-left:4px solid var(--red);background:var(--navy-2);padding:18px;border-radius:0 18px 18px 0;display:flex;flex-direction:column;gap:8px}
.leak .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red-2)}
.leak .t{font-weight:900;font-size:22px;line-height:1.2}
.leak .fix{font-size:15px;color:var(--ink);background:rgba(63,191,127,.1);border:1px solid rgba(63,191,127,.35);border-radius:12px;padding:10px 12px}
.leak .fix b{color:#7fe0ae}
.cta{background:var(--navy-2);border:1.5px solid var(--red);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.cta ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cta li{display:flex;gap:10px;align-items:flex-start}
.cta li::before{content:"✓";flex:none;color:var(--keep);font-weight:900}

.facts{background:var(--label-bg);color:var(--label-ink);border:2px solid var(--label-ink);padding:14px 16px 16px;border-radius:4px;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.facts .ft{font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1;border-bottom:1px solid var(--label-ink);padding-bottom:6px}
.facts .serv{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:8px solid var(--label-ink)}
.scoreline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px;border-bottom:4px solid var(--label-ink)}
.scoreline .lbl{font-weight:900;font-size:20px}
.scoreline .band{font-weight:600;font-size:15px}
.bignum{font-weight:900;font-size:60px;line-height:.9}
.bignum span{font-size:20px}
.vhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-block:6px;border-bottom:1px solid var(--label-ink)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:10px;border-bottom:1px solid #c9ced8}
.vrow .nm{font-weight:800;min-width:0}
.vrow .why{grid-column:1 / -1;font-size:14px;color:var(--label-mute);line-height:1.45}
.vrow .why b{color:var(--label-ink)}
.vrow .go{grid-column:1 / -1;font-size:14px;font-weight:800;color:#b5281f;text-decoration:none;justify-self:start}
.vrow .go:hover{text-decoration:underline}
.pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:4px;white-space:nowrap;align-self:start}
.p-worth{background:#dff5ea;color:#13633d}
.p-situational{background:#fdf0d4;color:#7a5408}
.p-skip{background:#fde2e0;color:#a3221b}
.p-risk{background:#a3221b;color:#fff}
.p-add{background:#13633d;color:#fff}
.trow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--label-ink);font-weight:800}
.trow:last-child{border-bottom:8px solid var(--label-ink)}
.trow .v{text-align:right}
.foot{font-size:12px;color:var(--label-mute);padding-top:8px}
.share{display:flex;flex-direction:column;gap:10px;background:var(--navy-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.share code{font-family:var(--f);font-size:14px;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.coach{font-size:15px;color:var(--muted);text-align:center}
.coach a{color:var(--ink);font-weight:700}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin:48px auto 0;padding-bottom:24px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.legal a{color:#9fb0c8;text-decoration:none}
.legal a:hover{color:#fff}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:420px){.proof b,.tiles b{font-size:18px}.bignum{font-size:52px}.facts .ft{font-size:26px}.gauge{width:176px;height:176px}.gauge .num b{font-size:56px}}
@media (min-width:900px){
  body{font-size:17px}
  .wrap{max-width:1080px;padding-block:32px 64px}
  .wrap.narrow main{max-width:640px;margin-inline:auto}
  .hero{align-items:center;text-align:center;margin-top:52px}
  .hero .sub{max-width:720px;font-size:22px}
  .hero .ctawrap{width:100%;max-width:460px}
  .hero .proof{width:100%;max-width:780px}
  .hero .byline{justify-content:center}
  .sec{padding-top:60px;margin-top:60px}
  .sec>.eyebrow,.sec>h2{text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .grid2>*{min-width:0}
  .steps{grid-template-columns:repeat(3,1fr);gap:24px}
  .steps li{grid-template-columns:1fr}
  .me{max-width:780px;margin-inline:auto;grid-template-columns:140px 1fr;gap:28px}
  .me img{width:140px;height:140px}
  .faq{grid-template-columns:repeat(3,1fr)}
  .ctaend{max-width:460px;margin-inline:auto;width:100%}
  .res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:start}
  .res>*{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script defer src="/_vercel/insights/script.js"></script>

  {id:"weekend",q:"How are your weekends?",opts:["On track","A bit loose","I undo the whole week"]}

const state = {step:0, a:{}, picked:new Set(), none:{supp:false,gear:false}, other:"", filter:"", showAll:{supp:false,gear:false}, name:"", email:"", result:null, sent:false};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$"+Math.round(n).toLocaleString("en-US");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- search: names, brands and nicknames ---------- */
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function match(p,f){
  if(!f) return {ok:true};
  const n=norm(p.n+" "+p.full);
  if(n.includes(f)) return {ok:true};
  const hit=p.a.find(a=>norm(a).includes(f)||(f.length>3&&f.includes(norm(a))));
  return hit?{ok:true,via:hit}:{ok:false};
}

/* ---------- scoring ---------- */
const SPEND_CAP = {"Under $50":600,"$50–100":1200,"$100–200":2400,"$200+":Infinity};
function computeResult(){
  const a=state.a, picked=[...state.picked].map(id=>PMAP[id]).filter(Boolean);
  let productPts = picked.reduce((s,p)=>s+p.pts,0);
  const missingCreatine = !state.picked.has("creatine");
  if(missingCreatine) productPts += 5;
  productPts = Math.min(productPts,40);
  const proteinPts = {"Yes":0,"Sometimes":8,"No":15,"No idea how much I need":12}[a.protein] ?? 0;
  const trainPts   = {"4+":0,"2–3":8,"0–1":15}[a.train] ?? 0;
  const calPts     = {"Yes":0,"Roughly":5,"No idea":12}[a.cals] ?? 0;
  const wkPts      = {"On track":0,"A bit loose":6,"I undo the whole week":12}[a.weekend] ?? 0;
  const score = Math.max(12, Math.min(96, 100-productPts-proteinPts-trainPts-calPts-wkPts));

  // Money: what they rebuy every month (capped by what they told us they spend) plus gadgets already bought.
  const rawYear = picked.filter(p=>p.k==="skip").reduce((s,p)=>s+p.m,0)*12;
  const wasteYear = Math.min(rawYear, SPEND_CAP[a.spend] ?? Infinity);
  const gearSpent = picked.filter(p=>p.k==="skip").reduce((s,p)=>s+p.o,0);
  const skips = picked.filter(p=>p.k==="skip"||p.k==="risk");

  const leaks = [
    {k:"stack",pts:productPts,t:"Your stack",d:skips.length?`${skips.length} of the things you buy ${skips.length===1?"isn't":"aren't"} moving you closer to your abs.`:"You're missing the one supplement that's cheap and proven.",fix:skips.length?"Stop reordering anything marked Skip it. Put that money into food.":"Add plain creatine monohydrate, 3–5g a day. It's about $10 a month."},
    {k:"protein",pts:proteinPts,t:"Your protein",d:"Without enough protein you lose muscle while you diet, so there's less to show when the fat comes off.",fix:"Your free plan gives you your exact daily protein number, and meals that hit it."},
    {k:"train",pts:trainPts,t:"Your training",d:"Fewer than 4 days a week makes it hard to hold muscle while you lose fat.",fix:"Your free plan builds 45-minute workouts around the days you can actually train."},
    {k:"cals",pts:calPts,t:"Your calories",d:"If you don't know what you eat, hidden calories are quietly stalling your fat loss.",fix:"Your free plan gives you your calories and a meal plan made only from foods you already eat."},
    {k:"weekend",pts:wkPts,t:"Your weekends",d:"Two loose days can wipe out five good ones. That's why the scale doesn't move.",fix:"Your free plan shows you what to order at the places you already go, so weekends stop undoing the week."}
  ].sort((x,y)=>y.pts-x.pts);
  const leak = leaks[0].pts>0 ? leaks[0] : {k:"last",t:"The last 10%",d:"Your basics are solid. What's left is dialing in the plan so the last layer comes off.",fix:"Your free plan sets your exact calories and protein so nothing is guesswork."};

  let band, tone, bandText;
  if(score<50){band="Leaking";tone="low";bandText="You're spending money and effort that isn't getting you closer to your abs.";}
  else if(score<75){band="Close, but leaking";tone="mid";bandText="You've got a decent foundation, but a few leaks are costing you your abs.";}
  else {band="Dialed in";tone="high";bandText="Your stack is solid. You're ready for the last 10%, and that's where a plan built for you makes the difference.";}

  const order={risk:0,skip:1,situational:2,worth:3};
  const verdicts=picked.slice().sort((x,y)=>order[x.k]-order[y.k]);
  return {score,band,tone,bandText,wasteYear,gearSpent,leak,verdicts,skips,missingCreatine};
}

/* ---------- lead source: ?src=video-name from a video link, remembered for this visitor ---------- */
const LEAD_SOURCE = (()=>{ let v=""; try{ const q=new URLSearchParams(location.search); v=q.get("src")||q.get("utm_source")||""; if(v) localStorage.setItem("sps_src",v); else v=localStorage.getItem("sps_src")||""; }catch(e){} if(!v){ try{ v=document.referrer?new URL(document.referrer).hostname:""; }catch(e){} } return (v||"direct").slice(0,80); })();

/* ---------- Kit ---------- */
function reportLines(r){
  const L = r.verdicts.map(p=>{
    const tag = p.k==="risk"?"RISKY":KIND[p.k].toUpperCase();
    let line = `${p.full}: ${tag}. ${p.h.replace(/\.?$/,".")}`;
    if((p.k==="skip"||p.k==="situational") && p.s) line += ` Cheaper swap: ${p.s}.`;
    return line;
  });
  if(state.other.trim()) L.push(`${state.other.trim()}: CHECK. Look it up in Stack Check in the app.`);
  if(r.missingCreatine) L.push("Creatine (missing): ADD. The one supplement I'd never cut. Plain monohydrate, 3–5g a day.");
  if(!L.length) L.push("Nothing yet: GOOD. You're not wasting money. Your results come from the basics.");
  return L;
}
async function sendToKit(r){
  const fields = {stack_score:String(r.score), goal:state.a.goal||"", monthly_spend:state.a.spend||"", stack_band:r.band,
    stack_leak:`${r.leak.t}. ${r.leak.d} ${r.leak.fix}`,
    stack_waste:r.wasteYear>0?`About ${money(r.wasteYear)} a year`:"Little to none",
    stack_report:reportLines(r).join("\n"), lead_source:LEAD_SOURCE};
  try{
    const res = await fetch(`https://api.convertkit.com/v3/forms/${KIT_FORM_ID}/subscribe`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({api_key:KIT_API_KEY,email:state.email,first_name:state.name,fields})});
    if(res.ok) return true;
    throw new Error("api");
  }catch(e){
    try{
      const fd=new FormData(); fd.append("email_address",state.email); fd.append("first_name",state.name);
      Object.entries(fields).forEach(([k,v])=>fd.append(`fields[${k}]`,v));
      await fetch(`https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions`,{method:"POST",mode:"no-cors",body:fd});
      return true;
    }catch(e2){ return false; }
  }
}

/* ---------- navigation ---------- */
const GATE = Q.length+1, CALC = Q.length+2, RES = Q.length+3;
function render(){
  const s=state.step;
  document.querySelector(".wrap").classList.toggle("narrow", s>=1 && s<RES);
  if(s===0) return renderStart();
  if(s<=Q.length) return renderQuestion(s-1);
  if(s===GATE) return renderGate();
  if(s===CALC) return renderCalc();
  return renderResults();
}
function go(n){ state.step=n; render(); window.scrollTo({top:0,behavior:reduce?"auto":"smooth"}); const h=app.querySelector("h1,h2"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }
function progress(i){
  const pct=Math.round(((i+1)/Q.length)*100);
  return `<div class="progress"><div class="qmeta"><span>Question ${i+1} of ${Q.length}</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

/* ---------- questions ---------- */
function renderQuestion(i){
  const q=Q[i];
  if(q.type==="pick") return renderPick(i);
  const cur=state.a[q.id];
  app.innerHTML = `${progress(i)}
  <section class="screen stack fade">
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${cur===o}"><span>${esc(o)}</span><span class="arrow">→</span></button>`).join("")}</div>
    <div><button class="link" id="back">← Back</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    state.a[q.id]=q.opts[+b.dataset.k];
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    setTimeout(()=>go(state.step+1),160);
  });
  document.getElementById("back").onclick=()=>go(state.step-1);
}

function chip(p,via){
  return `<label class="chk"><input type="checkbox" value="${p.id}" ${state.picked.has(p.id)?"checked":""}><span class="box"></span><span>${esc(p.n)}${via?` <span class="via">(${esc(via)})</span>`:""}</span></label>`;
}
function renderPick(i){
  const q=Q[i], g=q.group, f=norm(state.filter);
  const pool=PRODUCTS.filter(p=>p.g===g);
  let body="";
  if(f){
    const hits=pool.map(p=>({p,m:match(p,f)})).filter(x=>x.m.ok);
    const other=PRODUCTS.filter(p=>p.g!==g).map(p=>({p,m:match(p,f)})).filter(x=>x.m.ok);
    const all=[...hits,...other];
    body = all.length ? `<div class="chips">${all.map(x=>chip(x.p,x.m.via)).join("")}</div>`
      : `<p class="muted">I haven't investigated that one yet. Add it below and I'll flag it in your report.</p>`;
  } else if(!state.showAll[g]){
    const pop=pool.filter(p=>p.pop<99).sort((a,b)=>a.pop-b.pop);
    const extra=pool.filter(p=>p.pop===99 && state.picked.has(p.id));
    body = `<div class="cat"><h3>Most common</h3><div class="chips">${[...pop,...extra].map(p=>chip(p)).join("")}</div></div>
      <button class="more" id="all">Show all ${pool.length} →</button>`;
  } else {
    const cats=[...new Set(pool.map(p=>p.c))];
    body = cats.map(c=>`<div class="cat"><h3>${esc(c)}</h3><div class="chips">${pool.filter(p=>p.c===c).map(p=>chip(p)).join("")}</div></div>`).join("");
  }
  const mine=[...state.picked].map(id=>PMAP[id]).filter(p=>p&&p.g===g);
  const noneLabel = g==="supp" ? "I don't take anything yet" : "None of these";
  app.innerHTML = `${progress(i)}
  <section class="screen stack fade" style="gap:16px">
    <h2>${esc(q.q)}</h2>
    <p class="hint">${esc(q.hint)}</p>
    <label class="chk" style="align-self:flex-start"><input type="checkbox" id="none" ${state.none[g]?"checked":""}><span class="box"></span><span>${noneLabel}</span></label>
    <input class="search" id="filter" type="search" placeholder="${g==="supp"?"Search a product or brand…":"Search, e.g. Whoop, Theragun…"}" value="${esc(state.filter)}" aria-label="Search products" autocomplete="off">
    ${body}
    ${g==="supp"?`<div class="field"><label for="other">Something else? Type it in</label><input type="text" id="other" placeholder="e.g. a specific brand or product" value="${esc(state.other)}"></div>`:""}
  </section>
  <div class="sticky-next">
    <button class="btn ghost" id="back" style="width:auto" aria-label="Back">←</button>
    <button class="btn" id="next">${mine.length?`Next (${mine.length} picked) →`:"Next →"}</button>
  </div>`;
  app.querySelectorAll('.chk input[value]').forEach(cb=>cb.onchange=()=>{
    cb.checked?state.picked.add(cb.value):state.picked.delete(cb.value);
    if(cb.checked){state.none[g]=false;const n=document.getElementById("none");if(n)n.checked=false;}
    const c=[...state.picked].filter(id=>PMAP[id]?.g===g).length;
    document.getElementById("next").textContent=c?`Next (${c} picked) →`:"Next →";
  });
  document.getElementById("none").onchange=e=>{
    state.none[g]=e.target.checked;
    if(e.target.checked){pool.forEach(p=>state.picked.delete(p.id));renderPick(i);}
  };
  const fi=document.getElementById("filter");
  fi.oninput=()=>{state.filter=fi.value;const pos=fi.selectionStart;renderPick(i);const n=document.getElementById("filter");n.focus();n.setSelectionRange(pos,pos);};
  const all=document.getElementById("all"); if(all) all.onclick=()=>{state.showAll[g]=true;renderPick(i);};
  const ot=document.getElementById("other"); if(ot) ot.oninput=e=>state.other=e.target.value;
  document.getElementById("back").onclick=()=>{state.filter="";go(state.step-1);};
  document.getElementById("next").onclick=()=>{state.filter="";go(state.step+1);};
}

/* ---------- email gate ---------- */
function renderGate(){
  const n=state.picked.size;
  app.innerHTML = `
  <div class="progress"><div class="qmeta"><span>Done</span><span>100%</span></div><div class="bar"><i style="width:100%"></i></div></div>
  <section class="screen stack fade" style="margin-top:24px">
    <h2>✅ Your Stack Score is ready.</h2>
    <div class="gatewrap">
      <div class="facts blurred" aria-hidden="true">
        <div class="ft">Stack Score Facts</div>
        <div class="scoreline"><div><div class="lbl">Stack Score</div><div class="band">"———"</div></div><div class="bignum">??<span>/100</span></div></div>
        <div class="vrow"><span class="nm">████████</span><span class="pill p-skip">Skip it</span></div>
        <div class="vrow"><span class="nm">██████</span><span class="pill p-worth">Worth it</span></div>
        <div class="trow"><span>Wasted a year</span><span class="v">$█,███</span></div>
      </div>
      <div class="badge"><span>🔒 ${n?`${n} product${n===1?"":"s"} checked`:"Your report is ready"}</span></div>
    </div>
    <p style="font-size:19px;font-weight:700">Where should I send your report?</p>
    <ul class="inside">
      <li>Your score out of 100</li>
      <li>My verdict on ${n?`all ${n} things you picked`:"your stack"}, plus the cheaper swap</li>
      <li>What you're wasting every year</li>
      <li>Your #1 leak and exactly how to fix it</li>
    </ul>
    <form id="gate" class="stack" novalidate style="gap:12px">
      <div class="field"><label for="name">First name</label>
        <input type="text" id="name" autocomplete="given-name" placeholder="Your first name" value="${esc(state.name)}" required></div>
      <div class="field"><label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="you@email.com" value="${esc(state.email)}" required>
        <div class="err" id="err" role="alert"></div></div>
      <button class="btn" id="show" type="submit">Show My Stack Score →</button>
      <p class="muted small" style="text-align:center">🔒 No spam. Unsubscribe anytime.</p>
    </form>
    <div><button class="link" id="back">← Back</button></div>
  </section>`;
  document.getElementById("back").onclick=()=>go(state.step-1);
  document.getElementById("gate").onsubmit=e=>{
    e.preventDefault();
    const nm=document.getElementById("name").value.trim(), em=document.getElementById("email").value.trim(), err=document.getElementById("err");
    if(nm.length<2){err.textContent="Add your first name so I know who the report is for.";return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){err.textContent="Enter a valid email so I can send your report.";return;}
    state.name=nm.charAt(0).toUpperCase()+nm.slice(1); state.email=em;
    state.result=computeResult();
    // Hand the answers to the app on this same site, so the plan builder starts pre-filled.
    try{ localStorage.setItem("sps_stackscore", JSON.stringify({name:state.name,email:em,goal:state.a.goal,spend:state.a.spend,train:state.a.train,stack:[...state.picked],score:state.result.score,at:Date.now()})); }catch(x){}
    state.sending = sendToKit(state.result).then(ok=>state.sent=ok);
    go(CALC);
  };
}

/* ---------- the "working on it" beat ---------- */
function renderCalc(){
  const n=state.picked.size;
  const steps=[
    n?`Checking ${n} product${n===1?"":"s"} against my 47 verdicts`:"Checking your answers against my 47 verdicts",
    "Adding up what you spend",
    "Finding your #1 leak",
    "Building your report"
  ];
  app.innerHTML = `<section class="screen stack fade" style="margin-top:56px;align-items:center;text-align:center">
    <h2>Running your audit, ${esc(state.name)}…</h2>
    <ul class="calc" style="list-style:none;padding:0;margin:8px 0 0;text-align:left">${steps.map(s=>`<li><i></i>${esc(s)}</li>`).join("")}</ul>
  </section>`;
  const lis=[...app.querySelectorAll(".calc li")];
  const gap = reduce?60:520;
  lis.forEach((li,k)=>setTimeout(()=>li.classList.add("on"),gap*(k+1)));
  setTimeout(async()=>{ await Promise.race([state.sending,new Promise(r=>setTimeout(r,2500))]); go(RES); }, gap*(lis.length+1));
}

/* ---------- results ---------- */
function absLine(){
  return {"Never":"You've never seen your abs. Here's what's been in the way.",
          "Almost":"You're closer than you think. Here's what's in the way.",
          "Yes, but I lost them":"You've had them before. Here's what's keeping them hidden."}[state.a.abs] || "Here's what's in the way.";
}
function row(p){
  const pill = p.k==="risk"?`<span class="pill p-risk">Risky</span>`:`<span class="pill p-${p.k}">${KIND[p.k]}</span>`;
  const swap = (p.k==="skip"||p.k==="situational") && p.s ? ` <b>Cheaper swap:</b> ${esc(p.s)}.` : "";
  const link = p.k==="risk" ? "" : `<a class="go" href="${VERDICT_URL(p.id)}">See the full breakdown →</a>`;
  return `<div class="vrow"><span class="nm">${esc(p.n)}</span>${pill}<span class="why">${esc(p.h.replace(/\.?$/,"."))}${swap}</span>${link}</div>`;
}
function renderResults(){
  const r=state.result||computeResult();
  const rows=r.verdicts.map(row).join("");
  const otherRow = state.other.trim()?`<div class="vrow"><span class="nm">${esc(state.other.trim())}</span><span class="pill p-situational">Check</span><span class="why">I'd need to see the label. Look it up in Stack Check.</span><a class="go" href="${LOOKUP_URL}">Look it up in Stack Check →</a></div>`:"";
  const creatineRow = r.missingCreatine?`<div class="vrow"><span class="nm">Creatine (missing)</span><span class="pill p-add">Add</span><span class="why">The one supplement I'd never cut. Plain monohydrate, 3–5g a day, about $10 a month.</span><a class="go" href="${VERDICT_URL("creatine")}">Why creatine →</a></div>`:"";
  const empty = (!rows&&!otherRow)?`<div class="vrow"><span class="nm">Nothing yet</span><span class="pill p-worth">Good</span><span class="why">You're not wasting money. Your results come from the basics.</span></div>`:"";
  const wasteTile = r.wasteYear>0?money(r.wasteYear):"$0";
  const C=2*Math.PI*88, color={low:"#ff5a50",mid:"#f2b234",high:"#3fbf7f"}[r.tone];
  app.innerHTML = `
  <section class="screen res">
    <div class="stack" style="gap:18px">
      <div class="reveal fade">
        <span class="eyebrow">${esc(state.name)}'s Stack Score</span>
        <div class="gauge" role="img" aria-label="Stack Score ${r.score} out of 100">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="#1d3459" stroke-width="14"/>
            <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/></svg>
          <div class="num"><b id="sc">0</b><span>out of 100</span></div>
        </div>
        <span class="bandpill b-${r.tone}">${esc(r.band)}</span>
        <p style="font-size:17px;max-width:30em">${esc(absLine())}</p>
      </div>
      <div class="tiles fade">
        <div class="${r.wasteYear>0?"hot":""}"><b>${wasteTile}</b><span>wasted a year</span></div>
        <div class="${r.skips.length?"hot":""}"><b>${r.skips.length}</b><span>to stop buying</span></div>
        <div><b>${r.verdicts.filter(p=>p.k==="worth").length}</b><span>worth keeping</span></div>
      </div>
      ${r.gearSpent>0?`<p class="small muted" style="text-align:center;margin-top:-6px">Plus about ${money(r.gearSpent)} already spent on gadgets and tests that don't work.</p>`:""}
      <div class="leak fade">
        <span class="k">🚨 Your #1 leak</span>
        <span class="t">${esc(r.leak.t)}</span>
        <p>${esc(r.leak.d)}</p>
        <p class="fix"><b>The fix:</b> ${esc(r.leak.fix)}</p>
      </div>
      <div class="cta">
        <h2>Now fix it, free.</h2>
        <p>Your score shows what to stop. My app shows you what to do instead, built from the answers you just gave me.</p>
        <ul>
          <li>Your exact calories and protein</li>
          <li>A meal plan made only from foods you already eat</li>
          <li>Workouts on the days you choose, with a form video on every move</li>
          <li>Stack Check: my verdict on all 47 products, before you buy anything</li>
        </ul>
        <a class="btn" href="${PLAN_URL}">Build My Free Plan →</a>
        <p class="muted small" style="text-align:center">2 minutes. Your answers carry over. First 2 weeks free, no card.</p>
      </div>
    </div>

    <div class="stack" style="gap:18px">
      <span class="eyebrow">Your full report</span>
      <div class="facts" role="region" aria-label="Your Stack Score report">
        <div class="ft">Stack Score Facts</div>
        <div class="serv"><span>Serving size: 1 honest audit</span><span>${r.verdicts.length} product${r.verdicts.length===1?"":"s"} checked</span></div>
        <div class="scoreline"><div><div class="lbl">Stack Score</div><div class="band">"${esc(r.band)}"</div></div><div class="bignum">${r.score}<span>/100</span></div></div>
        <p style="font-size:15px;padding-block:8px;border-bottom:1px solid var(--label-ink)">${esc(r.bandText)}</p>
        <div class="vhead"><span>Product</span><span>Verdict</span></div>
        ${rows}${otherRow}${creatineRow}${empty}
        <div class="trow"><span>Wasted a year</span><span class="v">${r.wasteYear>0?"About "+money(r.wasteYear):"Little to none"}</span></div>
        <div class="trow"><span>#1 leak</span><span class="v">${esc(r.leak.t)}</span></div>
        <p class="foot">From Boon's Beyond the Label investigation. General information, not medical advice. Check with your doctor before stopping anything prescribed. Waste is an estimate based on typical prices.</p>
      </div>
      <p class="small muted">${state.sent?`A copy is on its way to <b style="color:#fff">${esc(state.email)}</b>.`:`A copy is on its way to <b style="color:#fff">${esc(state.email)}</b>. Check your promotions tab if you don't see it.`}</p>
      <a class="btn" href="${PLAN_URL}">Fix My #1 Leak, Free →</a>

        <p class="small muted">Send them the audit. It's free and takes 60 seconds.</p>
        <code id="shareurl">${SHARE_URL}</code>
        <button class="btn ghost sm" id="share">Copy link</button>
      </div>
      <p class="coach">Want me to do it with you? <a href="${COACH_URL}">See if you qualify for 1:1 coaching</a>. Abs in 12 weeks, or I coach you free until you do.</p>

    </div>

  // count up the score and draw the ring
  const sc=document.getElementById("sc"), arc=document.getElementById("arc"), target=r.score;
  requestAnimationFrame(()=>{ arc.style.strokeDashoffset = C*(1-target/100); });
  if(reduce){ sc.textContent=target; arc.style.transition="none"; }
  else { const t0=performance.now(), dur=1400; const tick=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); sc.textContent=Math.round(target*e); if(k<1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

  document.getElementById("share").onclick=async e=>{

    setTimeout(()=>b.textContent="Copy link",2200);
  };
  document.getElementById("redo").onclick=()=>{state.a={};state.picked.clear();state.none={supp:false,gear:false};state.other="";state.result=null;state.showAll={supp:false,gear:false};go(0);};
}

render();
</script>
