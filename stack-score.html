<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The free 60-second audit of how you lift, how you eat and what you take, with exactly what to tweak to hit your goal. By Boon Fay.">
<meta property="og:title" content="What's your Stack Score?">
<meta property="og:description" content="Free 60-second audit of your training, eating and supplements, with exactly what to tweak to hit your goal.">
<meta property="og:image" content="https://six-pack-stack.vercel.app/og-coaching.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* One centered column. The quiz moves screen to screen; the report renders as a "Supplement Facts" label. Single navy brand look, same as the app. */
:root{
  --navy:#0d1b33;--navy-2:#142645;--navy-3:#1d3459;--line:#2b4470;
  --ink:#ffffff;--muted:#c9d3e3;--dim:#93a3bd;
  --red:#e2433b;--red-2:#ff5a50;--keep:#3fbf7f;--warn:#f2b234;
  --label-bg:#ffffff;--label-ink:#0d1b33;--label-mute:#3a4a66;
  --f:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--ink)}
body{font-family:var(--f);font-size:16px;font-weight:500;line-height:1.55;font-variant-numeric:tabular-nums;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 40px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--ink);font-weight:800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0}
h1{font-size:clamp(38px,10vw,68px);line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red-2)}
h2{font-size:clamp(24px,6.4vw,32px);line-height:1.12;font-weight:900;letter-spacing:-.015em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red-2)}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--f);font-weight:900;font-size:17px;letter-spacing:.02em;text-transform:uppercase;
  background:var(--red);color:#fff;padding:18px 22px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;transition:background .15s,transform .15s;width:100%;text-align:center;line-height:1.2;
  box-shadow:0 10px 24px -10px rgba(226,67,59,.7)}
.btn:hover{background:var(--red-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--navy-2)}
.btn.sm{font-size:14px;padding:12px 16px}
.btn:focus-visible,.opt:focus-visible,.chk:focus-within,.link:focus-visible,input:focus-visible,.more:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.micro{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.micro span::before{content:"✓ ";color:var(--keep)}

/* start */
.hero{display:flex;flex-direction:column;gap:20px;margin-top:28px}
.sub{font-size:20px;line-height:1.4;max-width:30em}
.sub b{color:#fff}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proof div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof b{font-size:22px;font-weight:900;line-height:1.1}
.proof span{font-size:13px;color:var(--muted);line-height:1.3}
.sec{display:flex;flex-direction:column;gap:18px;padding-top:40px;margin-top:40px;border-top:1px solid var(--line)}
.bullets{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.bullets li{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:22px;height:22px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-weight:900;font-size:20px}
.steps b{display:block;font-size:18px}
.me{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center}
.me img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.faq{display:grid;gap:10px}
.faq div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.faq b{display:block;margin-bottom:2px}

/* quiz */
.progress{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;background:var(--navy-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.screen{margin-top:24px}
.hint{color:var(--muted);font-size:16px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;font-size:18px;font-weight:700;color:var(--ink);
  background:var(--navy-2);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--navy-3)}
.opt .arrow{color:var(--muted)}
.opt small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
.search{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--ink)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line);background:var(--navy-2);border-radius:99px;padding:10px 14px;font-size:15px;font-weight:600;user-select:none;max-width:100%;line-height:1.25}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.chk:has(input:checked){border-color:var(--red);background:var(--navy-3)}
.chk:has(input:checked) .box{background:var(--red);border-color:var(--red);color:#fff}
.chk:has(input:checked) .box::after{content:"✓"}
.chk .via{font-size:12px;color:var(--muted);font-weight:500}
.more{appearance:none;background:none;border:1.5px dashed var(--line);color:var(--ink);font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:12px;cursor:pointer;width:100%}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.picked span{background:var(--red);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:4px 10px}
.sticky-next{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--navy) 70%,transparent);display:flex;gap:12px;align-items:center;margin-top:8px;z-index:5}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:700}
.field input{width:100%;font:inherit;font-size:18px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--ink)}
.err{color:var(--red-2);font-size:15px;min-height:1.2em}

/* gate + calculating */
.gatewrap{position:relative}
.blurred{filter:blur(5px);pointer-events:none;user-select:none;opacity:.85}
.gatewrap .badge{position:absolute;inset:0;display:grid;place-items:center}
.gatewrap .badge span{background:var(--navy);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:800;font-size:15px}
.inside{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.inside li::before{content:"✓  ";color:var(--keep);font-weight:900}
.calc{display:grid;gap:14px;margin-top:8px}
.calc li{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:600;color:var(--dim);transition:color .3s}
.calc li i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:900;color:#fff;transition:all .3s}
.calc li.on{color:var(--ink)}
.calc li.on i{background:var(--keep);border-color:var(--keep)}
.calc li.on i::after{content:"✓"}

/* results */
.res{display:flex;flex-direction:column;gap:28px}
.reveal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:24px 18px;border-radius:22px;background:linear-gradient(180deg,rgba(29,52,89,.9),rgba(20,38,69,.6));border:1px solid var(--line)}
.gauge{position:relative;width:200px;height:200px;max-width:100%}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.gauge .num b{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.gauge .num span{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.bandpill{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.b-low{background:rgba(226,67,59,.18);color:#ff8a82;border:1px solid rgba(226,67,59,.5)}
.b-mid{background:rgba(242,178,52,.15);color:#ffd27a;border:1px solid rgba(242,178,52,.5)}
.b-high{background:rgba(63,191,127,.15);color:#7fe0ae;border:1px solid rgba(63,191,127,.5)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles div{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0}
.tiles b{font-size:22px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.tiles span{font-size:12px;color:var(--muted);line-height:1.3;font-weight:600}
.tiles .hot b{color:var(--red-2)}
.leak{border-left:4px solid var(--red);background:var(--navy-2);padding:18px;border-radius:0 18px 18px 0;display:flex;flex-direction:column;gap:8px}
.leak .k{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red-2)}
.leak .t{font-weight:900;font-size:22px;line-height:1.2}
.leak .fix{font-size:15px;color:var(--ink);background:rgba(63,191,127,.1);border:1px solid rgba(63,191,127,.35);border-radius:12px;padding:10px 12px}
.leak .fix b{color:#7fe0ae}
.cta{background:var(--navy-2);border:1.5px solid var(--red);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.cta ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.cta li{display:flex;gap:10px;align-items:flex-start}
.cta li::before{content:"✓";flex:none;color:var(--keep);font-weight:900}

.facts{background:var(--label-bg);color:var(--label-ink);border:2px solid var(--label-ink);padding:14px 16px 16px;border-radius:4px;box-shadow:0 14px 36px rgba(0,0,0,.4)}
.facts .ft{font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1;border-bottom:1px solid var(--label-ink);padding-bottom:6px}
.facts .serv{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:8px solid var(--label-ink)}
.scoreline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px;border-bottom:4px solid var(--label-ink)}
.scoreline .lbl{font-weight:900;font-size:20px}
.scoreline .band{font-weight:600;font-size:15px}
.bignum{font-weight:900;font-size:60px;line-height:.9}
.bignum span{font-size:20px}
.vhead{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-block:6px;border-bottom:1px solid var(--label-ink)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:10px;border-bottom:1px solid #c9ced8}
.vrow .nm{font-weight:800;min-width:0}
.vrow .why{grid-column:1 / -1;font-size:14px;color:var(--label-mute);line-height:1.45}
.vrow .why b{color:var(--label-ink)}
.vrow .go{grid-column:1 / -1;font-size:14px;font-weight:800;color:#b5281f;text-decoration:none;justify-self:start}
.vrow .go:hover{text-decoration:underline}
.pill{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:4px;white-space:nowrap;align-self:start}
.p-worth{background:#dff5ea;color:#13633d}
.p-situational{background:#fdf0d4;color:#7a5408}
.p-skip{background:#fde2e0;color:#a3221b}
.p-risk{background:#a3221b;color:#fff}
.p-add{background:#13633d;color:#fff}
.trow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--label-ink);font-weight:800}
.trow:last-child{border-bottom:8px solid var(--label-ink)}
.trow .v{text-align:right}
.foot{font-size:12px;color:var(--label-mute);padding-top:8px}
.share{display:flex;flex-direction:column;gap:10px;background:var(--navy-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.share code{font-family:var(--f);font-size:14px;color:var(--muted);overflow-wrap:anywhere;user-select:all}
.coach{font-size:15px;color:var(--muted);text-align:center}
.coach a{color:var(--ink);font-weight:700}
.legal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;margin:48px auto 0;padding-bottom:24px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.legal a{color:#9fb0c8;text-decoration:none}
.legal a:hover{color:#fff}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:420px){.proof b,.tiles b{font-size:18px}.bignum{font-size:52px}.facts .ft{font-size:26px}.gauge{width:176px;height:176px}.gauge .num b{font-size:56px}}
@media (min-width:900px){
  body{font-size:17px}
  .wrap{max-width:1080px;padding-block:32px 64px}
  .wrap.narrow main{max-width:640px;margin-inline:auto}
  .hero{align-items:center;text-align:center;margin-top:52px}
  .hero .sub{max-width:720px;font-size:22px}
  .hero .ctawrap{width:100%;max-width:460px}
  .hero .proof{width:100%;max-width:780px}
  .hero .byline{justify-content:center}
  .sec{padding-top:60px;margin-top:60px}
  .sec>.eyebrow,.sec>h2{text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .grid2>*{min-width:0}
  .steps{grid-template-columns:repeat(3,1fr);gap:24px}
  .steps li{grid-template-columns:1fr}
  .me{max-width:780px;margin-inline:auto;grid-template-columns:140px 1fr;gap:28px}
  .me img{width:140px;height:140px}
  .faq{grid-template-columns:repeat(3,1fr)}
  .ctaend{max-width:460px;margin-inline:auto;width:100%}
  .res{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:start}
  .res>*{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v3: four-step quiz with sub-questions, and a breakdown per area */
.qblock{display:flex;flex-direction:column;gap:10px}
.qblock>b{font-size:17px;font-weight:800;line-height:1.3}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{appearance:none;cursor:pointer;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--navy-2);border:1.5px solid var(--line);border-radius:99px;padding:10px 15px;line-height:1.25;text-align:left;transition:border-color .15s,background .15s}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--red);background:var(--red);color:#fff}
.seg button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.steplabel{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red-2)}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.areas a{background:var(--navy-2);border:1px solid var(--line);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;text-decoration:none;color:var(--ink)}
.areas a:hover{border-color:var(--muted)}
.areas .ring{position:relative;width:62px;height:62px}
.areas .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.areas .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900}
.areas span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.area{background:var(--navy-2);border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.area-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.area-h h3{font-size:22px;font-weight:900;line-height:1.15}
.area-h .sc{font-size:15px;font-weight:900;padding:6px 10px;border-radius:99px;white-space:nowrap}
.sc.low{background:rgba(226,67,59,.18);color:#ff8a82}
.sc.mid{background:rgba(242,178,52,.15);color:#ffd27a}
.sc.high{background:rgba(63,191,127,.15);color:#7fe0ae}
.working{font-size:15px;color:var(--muted);border-left:3px solid var(--keep);padding-left:12px}
.working b{color:#7fe0ae}
.tweaks{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:t}
.tweaks li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;counter-increment:t}
.tweaks li::before{content:counter(t);width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.tweaks b{display:block;font-size:17px;line-height:1.3;margin-bottom:2px}
.tweaks p{font-size:15px;color:var(--muted);line-height:1.5}
.tweaks .why{display:block;margin-top:4px;font-size:14px;color:var(--dim)}
.target{display:flex;flex-wrap:wrap;gap:8px}
.target span{font-size:13px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.prio{background:linear-gradient(180deg,rgba(226,67,59,.16),rgba(226,67,59,.05));border:1.5px solid rgba(226,67,59,.6);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:8px}
.prio .t{font-size:22px;font-weight:900;line-height:1.2}
.res-col{display:flex;flex-direction:column;gap:18px}
</style>
<script defer src="/_vercel/insights/script.js"></script>

</head>
<body>
<div class="wrap">
  <div class="brand"><span><span class="dot"></span><b>Stack Score</b></span><span>by Boon Fay</span></div>
  <main id="app" aria-live="polite"></main>
  <footer class="legal"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/disclaimer">Disclaimer</a></footer>
</div>
<script>
/* ======== SETTINGS ======== */
const KIT_API_KEY = "rWMhWOuYNu8lJKKWoWIfsg";   // Kit PUBLIC API key (safe in a web page)
const KIT_FORM_ID = "10078143";                  // "Stack Score" form in Kit

const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function match(p,f){
  if(!f) return {ok:true};
  if(norm(p.n+" "+p.full).includes(f)) return {ok:true};
  const hit=p.a.find(a=>norm(a).includes(f)||(f.length>3&&f.includes(norm(a))));
  return hit?{ok:true,via:hit}:{ok:false};
}

function tone(s){ return s<50?"low":s<75?"mid":"high"; }

function liftArea(a,g){
  let s=100; const T=[], good=[];
  const muscle = g==="muscle"||g==="recomp", lean = g==="fat"||g==="cut";
  if(a.days==="0–1"){ s-=40; T.push({t:"Train 3 days a week, full body",b:"Three 45-minute sessions that hit every muscle. That's the minimum that "+(lean?"holds on to your muscle while the fat comes off.":"starts building muscle you can see."),w:"Consistency beats intensity. 3 days you never miss is better than 5 you can't keep."}); }
  else if(a.days==="2–3"){
    if(muscle){ s-=25; T.push({t:"Add a 4th day",b:"Switch to an upper/lower split, 4 days a week. More quality sets per muscle each week is the biggest lever for growth once you're showing up.",w:"Each muscle gets trained twice a week instead of once."}); }
    else { s-=10; T.push({t:"Make every session full body",b:"With 2–3 days, hit every major muscle each session: a squat or leg press, a hinge, a push and a pull.",w:"That's how you keep your muscle while you diet, so you look lean, not just smaller."}); }
  } else good.push("You train 4+ days a week. That's the hardest part, done.");

  if(a.style==="Mostly cardio or classes"){ s-=30; T.push({t:"Swap 2 cardio sessions for weights",b:"Cardio burns calories, but lifting decides what you look like when the fat is gone. Keep the walks, trade the classes.",w:lean?"Without lifting, a big chunk of the weight you lose can be muscle.":"You can't build muscle without a reason to: heavy-ish weights."}); }
  else if(a.style==="Weights, I wing it"){ s-=15; T.push({t:"Run one plan for 8 weeks",b:"Same exercises in the same order every week. Change the weight and reps, not the workout.",w:"You can't beat last week's numbers if last week was a different workout."}); }
  else if(a.style==="I don't train yet"){ s-=35; T.push({t:"Start with 6 basic moves",b:"A squat, a hinge, a push, a pull, a lunge and a carry. Learn them light with clean form, then add weight every week.",w:"Beginners grow fastest. Your first 6 months are the best gains you'll ever get."}); }
  else good.push("You follow a set plan.");

  if(a.prog==="Not really"||a.prog==="Sometimes"){ s-=a.prog==="Not really"?20:10; T.push({t:"Beat last week by one rep",b:"Log every set. When you hit the top of your rep range on every set, add 5 lbs next time.",w:"That's progressive overload. If the weights don't go up, your muscles have no reason to change."}); }
  else if(a.prog) good.push("Your lifts go up because you track them.");

  if(lean) T.push({t:"Walk 8,000–10,000 steps a day",b:"Get them in short walks: after meals, on calls, parking further away.",w:"Over a week, steps burn more than most cardio sessions, without making you hungrier or hurting your recovery."});
  if(muscle && T.length<2) T.push({t:"Push most sets close to failure",b:"Finish most sets with 1–2 good reps left in the tank. If you could've done 5 more, the set didn't count for much.",w:"Effort per set matters more than the number of exercises."});
  return {key:"lift",name:"Lifting",score:clamp(s,10,100),tweaks:T.slice(0,3),good};
}

function eatArea(a,g){
  let s=100; const T=[], good=[], lean=g==="fat"||g==="cut";
  if(a.protein!=="Yes"){
    s-={"Sometimes":15,"No":30,"No idea how much I need":25}[a.protein]||0;
    T.push({t:"Hit your protein every day",b:"Aim for about 0.7–1g per pound of your goal body weight. For most guys that's 140–180g. Build every meal around a protein first.",w:lean?"It protects your muscle while you diet and keeps you full, so the deficit is easier.":"It's the raw material for new muscle. Train hard without it and you're leaving gains on the table."});
  } else good.push("You hit your protein. That's the habit most guys miss.");
  if(a.cals!=="Yes, I track"){
    s-=a.cals==="No idea"?25:10;
    const c={fat:{t:"Eat 400–500 calories under maintenance",b:"That's about 1 lb a week. Track for just 2 weeks to learn what your portions really are. You don't have to do it forever."},
             cut:{t:"Eat about 300 calories under maintenance",b:"Slow and steady for the last few pounds, about half a pound a week, so you keep your muscle and your abs show."},
             muscle:{t:"Eat 200–300 calories over maintenance",b:"A small surplus builds muscle without piling on fat. If the scale climbs more than 1 lb a month (beginners: 2 lbs), pull back."},
             recomp:{t:"Eat about 200 calories under maintenance",b:"A small deficit plus high protein and heavy lifting lets you lose fat and build muscle at the same time."}}[g];
    T.push({...c,w:a.cals==="Roughly"?"Roughly is close, but small misses add up over weeks. Know the number and the results get predictable.":"If you don't know your number, you're guessing. Most guys underestimate what they eat by a lot."});
  } else good.push("You know your calories.");
  if(a.weekend!=="On track"){
    s-=a.weekend==="I undo the whole week"?25:10;
    T.push({t:"Plan 2 meals out on the weekend",b:"Pick them ahead of time and keep the rest of the weekend like a weekday.",w:"Two loose days can wipe out five good ones. That's usually why the scale doesn't move."});
  } else good.push("Your weekends are on track.");
  if(a.out!=="Rarely"){
    s-=a.out==="Most meals"?15:5;
    T.push({t:"Pick 3 go-to orders",b:"One for each place you go most. Think a burrito bowl with double chicken, or grilled nuggets with a side salad. Decide before you walk in.",w:"When you've already decided, the menu doesn't decide for you."});
  }
  if(!T.length) T.push({t:"Re-check your calories every 4 weeks",b:"As your body changes, so does your maintenance. A small reset keeps the progress going.",w:"This is how you avoid the plateau."});
  const targets = [`Protein: 0.7–1g per lb of goal weight`, {fat:"Calories: 400–500 under maintenance",cut:"Calories: ~300 under maintenance",muscle:"Calories: 200–300 over maintenance",recomp:"Calories: ~200 under maintenance"}[g]];
  return {key:"eat",name:"Eating",score:clamp(s,10,100),tweaks:T.slice(0,3),good,targets};
}

  const skips=picked.filter(p=>p.k==="skip"), risks=picked.filter(p=>p.k==="risk"), deps=picked.filter(p=>p.k==="situational"), worth=picked.filter(p=>p.k==="worth");
  const missingCreatine=!state.picked.has("creatine");
  let s=100-picked.reduce((x,p)=>x+p.pts,0)-(missingCreatine?10:0);
  const wasteYear=skips.reduce((x,p)=>x+p.m,0)*12, gearSpent=skips.reduce((x,p)=>x+p.o,0);
  const T=[], good=[];
  if(risks.length) T.push({t:`Stop the ${listy(risks.map(p=>p.n))}`,b:"These aren't approved for people, they're often mislabeled, and the side effects are real. Talk to a doctor before you take anything like this.",w:"Nothing on your results is worth that risk."});
  if(skips.length) T.push({t:`Stop buying ${listy(skips.map(p=>{const n=p.n.replace(/ \(.*\)$/,"");return /^[A-Z][a-z]/.test(n)?n[0].toLowerCase()+n.slice(1):n;}))}`,b:wasteYear>0?`That's about ${money(wasteYear)} a year on things that aren't moving you closer to your goal. Finish what you have. Just don't reorder.`:"They aren't moving you closer to your goal. Don't buy more.",w:"Put that money into food. Groceries move the needle more than any pill."});
  if(missingCreatine) T.push({t:"Add creatine",b:"Plain creatine monohydrate, 3–5g a day, any time. About $10 a month.",w:"It's the most researched supplement there is for strength and muscle, and it's cheap."});
  if(a.protein!=="Yes" && !state.picked.has("whey_protein") && !state.picked.has("plant_protein")) T.push({t:"Use a protein shake on busy days",b:"A plain whey with a third-party seal. Only to fill the gap when food can't get you to your protein.",w:"It's food in a tub. Convenient, not magic."});
  if(deps.length) T.push({t:`Check if ${deps.length===1?deps[0].n.toLowerCase()+" is":"your “Depends” items are"} right for you`,b:`${listy(deps.map(p=>p.n))} only make${deps.length===1?"s":""} sense in certain cases. Tap through below to see if that's you.`,w:"Most guys pay for the full price and only need the cheap version."});
  if(!picked.length) good.push("You're not wasting money on supplements.");
  if(worth.length) good.push(`${listy(worth.map(p=>p.n))}: worth keeping.`);
  const order={risk:0,skip:1,situational:2,worth:3};
  return {key:"supp",name:"Supplements",score:clamp(s,10,100),tweaks:T.slice(0,3),good,
    verdicts:picked.slice().sort((x,y)=>order[x.k]-order[y.k]),wasteYear,gearSpent,missingCreatine,skips:skips.length+risks.length};
}

function computeResult(){
  const a=state.a, g=a.goal||"cut";
  const L=liftArea(a,g), E=eatArea(a,g), S=suppArea(a,g);
  const w = (g==="muscle")?{l:.45,e:.35,s:.20}:{l:.35,e:.45,s:.20};
  const score = clamp(L.score*w.l+E.score*w.e+S.score*w.s,10,98);
  // #1 tweak: first tweak of the weakest area (eating wins ties for fat loss, lifting for muscle)
  const areas=[L,E,S];
  const weakest = areas.slice().sort((x,y)=>x.score-y.score || (g==="muscle"?(x.key==="lift"?-1:1):(x.key==="eat"?-1:1)))[0];
  const top = weakest.tweaks[0];
  let band, bandText;
  if(score<50){band="Leaking";bandText=`A few big things are standing between you and your goal. The good news: they're all fixable.`;}
  else if(score<75){band="Close, but leaking";bandText=`You've got a decent foundation. A few tweaks are all that's standing between you and your goal.`;}
  else {band="Dialed in";bandText=`Your basics are solid. What's left is the last 10%, and that's where a plan built for you makes the difference.`;}
  return {score,band,tone:tone(score),bandText,areas,L,E,S,weakest,top};
}

    ${A.good.length?`<p class="working"><b>Working:</b> ${A.good.map(esc).join(" ")}</p>`:""}
    ${A.targets?`<div class="target">${A.targets.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
    <span class="eyebrow" style="color:var(--muted)">What to tweak</span>
    ${tweakList(A.tweaks)}
    ${extra||""}
  </section>`;
}
function vrow(p){
  const pill = p.k==="risk"?`<span class="pill p-risk">Risky</span>`:`<span class="pill p-${p.k}">${KIND[p.k]}</span>`;
  const swap = (p.k==="skip"||p.k==="situational") && p.s ? ` <b>Cheaper swap:</b> ${esc(p.s)}.` : "";
  const link = p.k==="risk" ? "" : `<a class="go" href="${VERDICT_URL(p.id)}">See the full breakdown →</a>`;
  return `<div class="vrow"><span class="nm">${esc(p.n)}</span>${pill}<span class="why">${esc(p.h.replace(/\.?$/,"."))}${swap}</span>${link}</div>`;
}
function verdictLabel(S){
  if(!S.verdicts.length && !state.other.trim()) return "";
  const other = state.other.trim()?`<div class="vrow"><span class="nm">${esc(state.other.trim())}</span><span class="pill p-situational">Check</span><span class="why">I'd need to see the label.</span><a class="go" href="${LOOKUP_URL}">Look it up in Stack Check →</a></div>`:"";
  return `<div class="facts" role="region" aria-label="Your supplement verdicts">
    <div class="ft">Supplement Facts</div>
    <div class="serv"><span>My verdict on what you take</span><span>${S.verdicts.length+(other?1:0)} checked</span></div>
    <div class="vhead"><span>Product</span><span>Verdict</span></div>
    ${S.verdicts.map(vrow).join("")}${other}
    <div class="trow"><span>Wasted a year</span><span class="v">${S.wasteYear>0?"About "+money(S.wasteYear):"Little to none"}</span></div>
    <p class="foot">From Boon's Beyond the Label investigation. General information, not medical advice. Check with your doctor before stopping anything prescribed. Waste is an estimate based on typical prices.</p>
  </div>${S.gearSpent>0?`<p class="small muted">Plus about ${money(S.gearSpent)} already spent on gadgets and tests that don't work.</p>`:""}`;
}
function renderResults(){
  const r=state.result||computeResult();
  const C=2*Math.PI*88, color={low:"#ff5a50",mid:"#f2b234",high:"#3fbf7f"}[r.tone];
  const planBtn = label => `<a class="btn" href="${PLAN_URL}">${label}</a>`;
  app.innerHTML = `
  <section class="screen res">
    <div class="res-col">
      <div class="reveal fade">
        <span class="eyebrow">${esc(state.name)}'s Stack Score</span>
        <div class="gauge" role="img" aria-label="Stack Score ${r.score} out of 100">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="#1d3459" stroke-width="14"/>
            <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/></svg>
          <div class="num"><b id="sc">0</b><span>out of 100</span></div>
        </div>
        <span class="bandpill b-${r.tone}">${esc(r.band)}</span>
        <p style="font-size:17px;max-width:30em">${esc(r.bandText)}</p>
      </div>
      <div class="areas fade">
        ${r.areas.map(A=>`<a href="#a-${A.key}"><div class="ring">${ring(A.score,62,7)}<b>${A.score}</b></div><span>${A.name}</span></a>`).join("")}
      </div>
      <div class="prio fade">
        <span class="eyebrow">🎯 Your #1 tweak · ${esc(r.weakest.name)}</span>
        <span class="t">${esc(r.top.t)}</span>
        <p>${esc(r.top.b)}</p>
        <p class="small muted">Why: ${esc(r.top.w)}</p>
      </div>
      <div class="cta">
        <h2>Get the full plan, free.</h2>
        <p>These are the tweaks. My app turns them into a plan to ${esc(GOAL_TEXT[state.a.goal]||"hit your goal")}, built from the answers you just gave me.</p>
        <ul>
          <li>Your exact calories and protein</li>
          <li>A meal plan made only from foods you already eat</li>
          <li>Workouts on the days you choose, with a form video on every move</li>
          <li>Stack Check: my verdict on all 47 products, before you buy anything</li>
        </ul>
        ${planBtn("Build My Free Plan →")}
        <p class="muted small" style="text-align:center">2 minutes. Your answers carry over. First 2 weeks free, no card.</p>
      </div>
    </div>

    <div class="res-col">
      <span class="eyebrow">Your full breakdown</span>
      ${areaCard(r.L)}
      ${areaCard(r.E)}
      ${areaCard(r.S, verdictLabel(r.S))}
      <p class="small muted">${state.sent?`A copy is on its way to <b style="color:#fff">${esc(state.email)}</b>.`:`A copy is on its way to <b style="color:#fff">${esc(state.email)}</b>. Check your promotions tab if you don't see it.`}</p>
      ${planBtn("Turn This Into My Free Plan →")}
      <div class="share">
        <b>Know someone who needs this?</b>
        <p class="small muted">Send them the audit. It's free and takes 60 seconds.</p>
        <code id="shareurl">${SHARE_URL}</code>
        <button class="btn ghost sm" id="share">Copy link</button>
      </div>
      <p class="coach">Want me to do it with you? <a href="${COACH_URL}">See if you qualify for 1:1 coaching</a>. Abs in 12 weeks, or I coach you free until you do.</p>
      <div style="text-align:center"><button class="link" id="redo">Retake the audit</button></div>
    </div>
  </section>`;

  const sc=document.getElementById("sc"), arc=document.getElementById("arc"), target=r.score;
  requestAnimationFrame(()=>{ arc.style.strokeDashoffset = C*(1-target/100); });
  if(reduce){ sc.textContent=target; arc.style.transition="none"; }
  else { const t0=performance.now(), dur=1400; const tick=t=>{ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); sc.textContent=Math.round(target*e); if(k<1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

  document.getElementById("share").onclick=async e=>{
    const b=e.currentTarget;
    try{ await navigator.clipboard.writeText(SHARE_URL); b.textContent="Copied ✓"; }
    catch(x){ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(document.getElementById("shareurl")); s.removeAllRanges(); s.addRange(rg); b.textContent="Selected. Copy it ✓"; }
    setTimeout(()=>b.textContent="Copy link",2200);
  };
  document.getElementById("redo").onclick=()=>{state.a={};state.picked.clear();state.none=false;state.other="";state.result=null;state.showAll=false;go(0);};
}

render();
</script>
</body>
</html>
