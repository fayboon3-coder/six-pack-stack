<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Score</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The free 60-second audit that shows guys exactly what to cut, keep and swap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one centered column, a quiz that moves screen to screen; results render as a "Supplement Facts" label. Single navy brand look. */
:root{
  --navy:#0d1b33;
  --navy-2:#142645;
  --navy-3:#1d3459;
  --line:#2b4470;
  --cream:#ffffff;
  --muted:#e3e9f2;
  --red:#e2433b;
  --red-2:#ff5a50;
  --keep:#3fbf7f;
  --warn:#f0b43c;
  --label-bg:#ffffff;
  --label-ink:#0d1b33;
  --display:"Montserrat","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --mono:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--cream)}
body{font-family:var(--body);font-size:16px;font-weight:500;line-height:1.55;font-variant-numeric:tabular-nums;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 56px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--cream);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(40px,9vw,64px);line-height:1;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red-2)}
h2{font-size:clamp(24px,6vw,32px);line-height:1.12;font-weight:900;letter-spacing:-.015em}
p{margin:0}
.lede{font-size:19px;color:var(--cream);max-width:34em}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:20px}
.hero{display:flex;flex-direction:column;gap:22px;margin-top:40px}
.bullets{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.bullets li{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:22px;height:22px;border-radius:4px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;margin-top:2px}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.02em;text-transform:uppercase;
  background:var(--red);color:#fff;padding:18px 26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  text-decoration:none;transition:background .15s, transform .15s;width:100%}
.btn:hover{background:var(--red-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.chk:focus-within,.link:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--navy-2)}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.byline{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);padding-top:18px}
.byline .av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy-3);display:grid;place-items:center;font-family:var(--display);font-weight:900;color:var(--red-2)}

/* example card on start screen */
.example{position:relative;border:1px dashed var(--line);border-radius:8px;padding:18px;display:flex;gap:18px;align-items:center;background:var(--navy-2)}
.example .tag{position:absolute;top:-10px;left:14px;background:var(--navy);padding:0 8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini-score{font-family:var(--mono);font-weight:700;font-size:40px;line-height:1;color:var(--red-2)}
.mini-score span{font-size:16px;color:var(--muted)}
.example ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px;min-width:0}

/* quiz */
.progress{margin-top:28px;display:flex;flex-direction:column;gap:8px}
.bar{height:6px;background:var(--navy-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.screen{margin-top:26px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;cursor:pointer;width:100%;font:inherit;font-size:18px;font-weight:600;color:var(--cream);
  background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--navy-3)}
.opt .arrow{color:var(--muted);font-family:var(--mono)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--navy-2);color:var(--cream)}
.cat{display:flex;flex-direction:column;gap:8px}
.cat h3{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:var(--navy-2);border-radius:99px;padding:9px 14px;font-size:15px;font-weight:500;user-select:none;max-width:100%}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.chk:has(input:checked){border-color:var(--red);background:var(--navy-3)}
.chk:has(input:checked) .box{background:var(--red);border-color:var(--red);color:#fff}
.chk:has(input:checked) .box::after{content:"✓"}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sticky-next{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--navy) 70%,transparent);display:flex;gap:12px;align-items:center}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:600}
.field input[type=email],.field input[type=text]{width:100%;font:inherit;font-size:18px;padding:16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--label-ink)}
.err{color:var(--red-2);font-size:15px;min-height:1.2em}
.lock{display:flex;gap:16px;align-items:center;background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:18px}
.lock .q{font-family:var(--mono);font-weight:700;font-size:44px;line-height:1;color:var(--muted);filter:blur(5px)}

/* results: supplement facts label */
.facts{background:var(--label-bg);color:var(--label-ink);border:2px solid var(--label-ink);padding:14px 16px 16px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.facts .ft{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.01em;line-height:1;border-bottom:1px solid var(--label-ink);padding-bottom:6px}
.facts .serv{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding-block:6px;border-bottom:8px solid var(--label-ink)}
.scoreline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:10px;border-bottom:4px solid var(--label-ink)}
.scoreline .lbl{font-family:var(--display);font-weight:900;font-size:20px}
.scoreline .band{font-weight:600;font-size:15px}
.bignum{font-family:var(--mono);font-weight:900;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.bignum span{font-size:22px}
.vhead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-block:6px;border-bottom:1px solid var(--label-ink)}
.vrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:8px;border-bottom:1px solid #c9ced8}
.vrow .nm{font-weight:700;min-width:0}
.vrow .why{grid-column:1 / -1;font-size:14px;color:#3a4a66}
.pill{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;align-self:start}
.p-keep{background:#dff5ea;color:#13633d}
.p-depends{background:#fdf0d4;color:#7a5408}
.p-cut{background:#fde2e0;color:#a3221b}
.p-risk{background:#a3221b;color:#fff}
.totals{display:grid;gap:0;margin-top:2px}
.trow{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--label-ink);font-weight:700}
.trow:last-child{border-bottom:8px solid var(--label-ink)}
.trow .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.foot{font-size:12px;color:#3a4a66;padding-top:8px}
.leak{border-left:4px solid var(--red);background:var(--navy-2);padding:16px 18px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px}
.leak .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red-2)}
.leak .t{font-family:var(--display);font-weight:800;font-size:22px}
.cta{background:var(--navy-2);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
.sent{font-size:14px;color:var(--muted)}
/* hormozi-style landing additions */
.callout{background:var(--red);color:#fff;text-align:center;font-weight:700;font-size:15px;padding:10px 14px;border-radius:6px;margin-top:18px}
.hero h1{font-size:clamp(38px,10vw,68px)}
.sub{font-size:21px;line-height:1.4;font-weight:500;max-width:30em}
.sub b{color:#fff}
.micro{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.micro span::before{content:"✓ ";color:var(--keep)}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proof div{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.proof b{font-family:var(--mono);font-size:22px;color:var(--cream);line-height:1.1}
.proof span{font-size:13px;color:var(--muted);line-height:1.3}
.sec{display:flex;flex-direction:column;gap:18px;padding-top:40px;margin-top:40px;border-top:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-2)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px}
.steps b{display:block;font-family:var(--display);font-size:19px}
.me{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.me .ph{width:96px;height:96px;border-radius:10px;background:var(--navy-3) center/cover no-repeat;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:34px;color:var(--red-2);border:1px solid var(--line)}
.faq{display:grid;gap:10px}
.faq div{background:var(--navy-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.faq b{display:block;margin-bottom:2px}
.inside{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.inside li::before{content:"✓  ";color:var(--keep);font-weight:800}
.blurred{filter:blur(4px);pointer-events:none;user-select:none;opacity:.85}
.gatewrap{position:relative}
.gatewrap .badge{position:absolute;inset:0;display:grid;place-items:center}
.gatewrap .badge span{background:var(--navy);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:700;font-size:15px}
.guarantee{border:2px dashed var(--keep);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.guarantee b{font-family:var(--display);font-size:19px}
.quote{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
@media (max-width:420px){.proof b{font-size:18px}.me{grid-template-columns:72px 1fr}.me .ph{width:72px;height:72px;font-size:26px}}
/* ---------- desktop layout ---------- */
.get-grid,.res-grid{display:grid;gap:22px}
.get-grid > *,.res-grid > *{min-width:0}
@media (min-width:900px){
  body{font-size:18px}
  .wrap{max-width:1120px;padding-block:36px 72px}
  .wrap.narrow-mode main{max-width:680px;margin-inline:auto}
  .hero{align-items:center;text-align:center;margin-top:56px;gap:26px}
  .hero h1{font-size:clamp(56px,6.4vw,84px)}
  .hero .sub{max-width:760px;font-size:23px}
  .hero .stack{width:100%;max-width:480px}
  .hero .proof{width:100%;max-width:820px}
  .proof b{font-size:28px}
  .sec{padding-top:64px;margin-top:64px;gap:24px}
  .sec > .eyebrow,.sec > h2{text-align:center}
  .get-grid{grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .get-grid .bullets{gap:16px;font-size:19px}
  .steps{grid-template-columns:repeat(3,1fr);gap:24px}
  .steps li{grid-template-columns:1fr;gap:12px}
  .me{max-width:820px;margin-inline:auto;grid-template-columns:150px 1fr;gap:28px}
  .me .ph{width:150px;height:150px}
  .faq{grid-template-columns:repeat(3,1fr)}
  .sec .ctaend{max-width:480px;margin-inline:auto;width:100%}
  .res-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:start}
  .res-grid .left{display:flex;flex-direction:column;gap:22px}
  .res-grid .bignum{font-size:84px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.bignum{font-size:54px}.facts .ft{font-size:26px}}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>

  {id:"abs",q:"Have you ever seen your abs?",opts:["Never","Almost","Yes, but I lost them"]},
  {id:"stack",q:"What do you take right now?",multi:true},
  {id:"spend",q:"About how much do you spend a month on supplements?",opts:["Under $50","$50–100","$100–200","$200+"]},
  {id:"protein",q:"Do you hit your protein most days?",opts:["Yes","Sometimes","No","No idea how much I need"]},
  {id:"train",q:"How many days a week do you train?",opts:["0–1","2–3","4+"]},
  {id:"cals",q:"Do you know roughly how many calories you eat?",opts:["Yes","Roughly","No idea"]},
  {id:"weekend",q:"How are your weekends?",opts:["On track","A bit loose","I undo the whole week"]}
];

const state = {step:0, answers:{}, stack:new Set(), other:"", email:"", filter:""};
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- scoring ---------- */
function computeResult(a, stack){
  const picked = [...stack].map(id=>PMAP[id]).filter(Boolean);
  let productPts = picked.reduce((s,p)=>s+p[4],0);
  if(!stack.has("creatine")) productPts += 5;
  productPts = Math.min(productPts,40);

  const proteinPts = {"Yes":0,"Sometimes":8,"No":15,"No idea how much I need":12}[a.protein] ?? 0;
  const trainPts   = {"4+":0,"2–3":8,"0–1":15}[a.train] ?? 0;
  const calPts     = {"Yes":0,"Roughly":5,"No idea":12}[a.cals] ?? 0;
  const wkPts      = {"On track":0,"A bit loose":6,"I undo the whole week":12}[a.weekend] ?? 0;

  let score = 100 - productPts - proteinPts - trainPts - calPts - wkPts;
  score = Math.max(10, Math.min(95, score));

  const wasteYear = picked.reduce((s,p)=>s+p[5],0) * 12;

  const leaks = [
    {k:"stack",pts:productPts,t:"Your stack",d:"You're paying for products that aren't moving you closer to your abs."},
    {k:"protein",pts:proteinPts,t:"Your protein",d:"Without enough protein, you lose muscle while you diet, so there's less to show when the fat comes off."},
    {k:"train",pts:trainPts,t:"Your training",d:"Fewer than 4 days a week makes it hard to hold muscle while you lose fat."},
    {k:"cals",pts:calPts,t:"Your calories",d:"If you don't know what you eat, hidden calories are quietly stalling your fat loss."},
    {k:"weekend",pts:wkPts,t:"Your weekends",d:"You're undoing your weekday progress every Saturday and Sunday."}
  ].sort((x,y)=>y.pts-x.pts);
  const leak = leaks[0].pts>0 ? leaks[0] : {t:"The last 10%",d:"Your basics are solid. What's left is dialing in the plan so the last layer comes off."};

  let band, bandText;
  if(score<50){band="Leaking";bandText="You're spending money and effort that isn't getting you closer to your abs.";}
  else if(score<75){band="Close, but leaking";bandText="You've got a decent foundation, but a few leaks are costing you your abs.";}
  else {band="Dialed in";bandText="Your stack is solid. You're ready for the last 10%, and that's where a plan built for you makes the difference.";}

  const order = {risk:0,cut:1,depends:2,keep:3};
  const verdicts = picked.slice().sort((x,y)=>order[x[3]]-order[y[3]]);
  return {score, band, bandText, wasteYear, leak, verdicts};
}

/* ---------- Kit signup ---------- */
async function sendToKit(email, r){
  const fields = {stack_score:String(r.score), goal:state.answers.goal||"", monthly_spend:state.answers.spend||""};
  try{
    const res = await fetch(`https://api.convertkit.com/v3/forms/${KIT_FORM_ID}/subscribe`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({api_key:KIT_API_KEY,email,fields})
    });
    if(res.ok) return true;
    throw new Error("api");
  }catch(e){
    try{
      const fd = new FormData();
      fd.append("email_address",email);
      Object.entries(fields).forEach(([k,v])=>fd.append(`fields[${k}]`,v));
      await fetch(`https://app.kit.com/forms/${KIT_FORM_ID}/subscriptions`,{method:"POST",mode:"no-cors",body:fd});
      return true;
    }catch(e2){ return false; }
  }
}

/* ---------- screens ---------- */
function render(){
  const s = state.step;
  document.querySelector(".wrap").classList.toggle("narrow-mode", s>=1 && s<=QUESTIONS.length+1);
  if(s===0) return renderStart();
  if(s>=1 && s<=QUESTIONS.length) return renderQuestion(s-1);
  if(s===QUESTIONS.length+1) return renderGate();
  return renderResults();
}
function progress(i){
  const pct = Math.round(((i+1)/QUESTIONS.length)*100);
  return `<div class="progress"><div class="qmeta"><span>Question ${i+1} of ${QUESTIONS.length}</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
}
function go(n){ state.step=n; render(); window.scrollTo({top:0,behavior:"smooth"}); const h=app.querySelector("h1,h2"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }

  <div class="micro"><span>Free</span><span>60 seconds</span><span>No sign-up to start</span></div></div>`;
}

function renderQuestion(i){
  const Q = QUESTIONS[i];
  if(Q.multi) return renderStack(i);
  const cur = state.answers[Q.id];
  app.innerHTML = `${progress(i)}
  <section class="screen stack">
    <h2>${esc(Q.q)}</h2>
    <div class="opts">${Q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="${cur===o}"><span>${esc(o)}</span><span class="arrow">→</span></button>`).join("")}</div>
    <div><button class="link" id="back">← Back</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    state.answers[Q.id]=Q.opts[+b.dataset.k];
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    setTimeout(()=>go(state.step+1),160);
  });
  document.getElementById("back").onclick=()=>go(state.step-1);
}

function renderStack(i){
  const f = state.filter.trim().toLowerCase();
  const catHtml = CATS.map(c=>{
    const items = PRODUCTS.filter(p=>p[2]===c && (!f || p[1].toLowerCase().includes(f)));
    if(!items.length) return "";
    return `<div class="cat"><h3>${esc(c)}</h3><div class="chips">${items.map(p=>`
      <label class="chk"><input type="checkbox" id="p-${p[0]}" value="${p[0]}" ${state.stack.has(p[0])?"checked":""}><span class="box"></span><span>${esc(p[1])}</span></label>`).join("")}</div></div>`;
  }).join("");
  app.innerHTML = `${progress(i)}
  <section class="screen stack">
    <h2>What do you take right now?</h2>
    <p class="muted">Tick everything. Be honest, it's just you and the results.</p>
    <input class="search" id="filter" type="search" placeholder="Search products…" value="${esc(state.filter)}" aria-label="Search products">
    ${catHtml || `<p class="muted">No match. Add it under "Other" below.</p>`}
    <div class="field">
      <label for="other">Other (type it in)</label>
      <input type="text" id="other" placeholder="e.g. a specific brand or product" value="${esc(state.other)}">
    </div>
    <label class="chk" style="align-self:flex-start"><input type="checkbox" id="p-none" ${state.stack.size===0 && state.answers.stack==="none"?"checked":""}><span class="box"></span><span>Nothing yet</span></label>
  </section>
  <div class="sticky-next">
    <button class="btn ghost" id="back" style="width:auto">←</button>
    <button class="btn" id="next">Next → <span class="count" id="cnt" style="color:#fff">${state.stack.size?`(${state.stack.size})`:""}</span></button>
  </div>`;
  const upd=()=>{document.getElementById("cnt").textContent=state.stack.size?`(${state.stack.size})`:"";};
  app.querySelectorAll('.chk input[value]').forEach(cb=>cb.onchange=()=>{
    cb.checked?state.stack.add(cb.value):state.stack.delete(cb.value);
    if(cb.checked){document.getElementById("p-none").checked=false;state.answers.stack="";}
    upd();
  });
  document.getElementById("p-none").onchange=e=>{
    if(e.target.checked){state.stack.clear();state.answers.stack="none";app.querySelectorAll('.chk input[value]').forEach(c=>c.checked=false);upd();}
    else state.answers.stack="";
  };
  const fi=document.getElementById("filter");
  fi.oninput=()=>{state.filter=fi.value;const pos=fi.selectionStart;renderStack(i);const n=document.getElementById("filter");n.focus();n.setSelectionRange(pos,pos);};
  document.getElementById("other").oninput=e=>state.other=e.target.value;
  document.getElementById("back").onclick=()=>go(state.step-1);
  document.getElementById("next").onclick=()=>{state.filter="";go(state.step+1);};
}

function renderGate(){
  app.innerHTML = `
  <div class="progress"><div class="qmeta"><span>Done</span><span>100%</span></div><div class="bar"><i style="width:100%"></i></div></div>
  <section class="screen stack" style="margin-top:28px">
    <h2>✅ Your Stack Score is ready.</h2>
    <div class="gatewrap">
      <div class="facts blurred" aria-hidden="true">
        <div class="ft">Stack Score Facts</div>
        <div class="scoreline"><div><div class="lbl">Your Stack Score</div><div class="band">"———"</div></div><div class="bignum">??<span>/100</span></div></div>
        <div class="vrow"><span class="nm">████████</span><span class="pill p-cut">Cut</span></div>
        <div class="vrow"><span class="nm">██████</span><span class="pill p-keep">Keep</span></div>
        <div class="trow"><span>Estimated yearly waste</span><span class="v">$█,███</span></div>
      </div>
      <div class="badge"><span>🔒 Enter your email to unlock</span></div>
    </div>
    <p class="lede">Where should I send your full report?</p>
    <ul class="inside">
      <li>Your score out of 100</li>
      <li>Your verdict on every product you take</li>

      <li>Your #1 leak and how to fix it</li>

      </div>
      <button class="btn" id="show" type="submit">Show My Stack Score →</button>

  document.getElementById("back").onclick=()=>go(state.step-1);
  document.getElementById("gate").onsubmit=async e=>{
    e.preventDefault();
    const em=document.getElementById("email").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){document.getElementById("err").textContent="Enter a valid email so I can send your report.";return;}
    state.email=em;
    const btn=document.getElementById("show");btn.disabled=true;btn.textContent="Calculating…";
    const r=computeResult(state.answers,state.stack);
    state.result=r;
    state.sent = await sendToKit(em,r);
    go(state.step+1);
  };
}

    </div>`;
  app.innerHTML = `
  <section class="screen res-grid" style="margin-top:32px">

    <div class="scoreline" style="border:0;padding:0;align-items:center">
      <div><span class="eyebrow">Your Stack Score</span><h2 style="margin-top:4px">"${esc(r.band)}"</h2></div>
      <div class="bignum" style="color:var(--red-2)">${r.score}<span style="color:var(--muted)">/100</span></div>
    </div>

      <div class="totals">
        <div class="trow"><span>Estimated yearly waste</span><span class="v">${wasteTxt}</span></div>
